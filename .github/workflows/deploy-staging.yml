# B473 — staging deploy: same immutable-image flow as production (deploy.yml),
# pointed at the staging contour on eterapy-1 (/opt/eterapy-staging, port 3201,
# database eterapy_staging). The image is built with staging NEXT_PUBLIC_*
# domains; runtime secrets live only in the VM's /opt/eterapy-staging/.env —
# this workflow never receives prod runtime secrets.
name: Deploy to Staging

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/playwright.yml'
      - '.artifacts/**'
      - '.agents/**'
      - '.qwen/**'
      - '.claude/**'
      - '.gemini/**'
      - '.opencode/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip jest tests (emergency only)'
        required: false
        default: false
        type: boolean

# Staging deploys queue independently of production.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  VM_HOST: 192.144.14.146
  VM_USER: admin
  STAGING_DIR: /opt/eterapy-staging
  COMPOSE_FILE_NAME: docker-compose.staging.yml
  # Probe the app subdomain: it resolves directly to the VPS and /api/health is
  # exempt from Basic Auth.
  HEALTH_URL: https://staging.app.eterapy.com/api/health

jobs:
  test:
    name: Unit tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate
      - name: Run tests
        working-directory: web
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NODE_ENV: test
        run: npm test -- --ci --passWithNoTests --silent

  deploy:
    name: Build image & converge staging
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build release image (staging domains)
        run: |
          docker build -f deploy/docker/Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL="https://staging.eterapy.com" \
            --build-arg NEXT_PUBLIC_USE_SUBDOMAINS="true" \
            --build-arg NEXT_PUBLIC_MAIN_DOMAIN="staging.eterapy.com" \
            --build-arg NEXT_PUBLIC_APP_DOMAIN="staging.app.eterapy.com" \
            --build-arg NEXT_PUBLIC_ADMIN_DOMAIN="staging.admin.eterapy.com" \
            --build-arg NEXT_PUBLIC_LIVEKIT_URL="" \
            --build-arg NEXT_PUBLIC_TELEGRAM_BOT_USERNAME="eterapy_staging_bot" \
            -t "eterapy-web-staging:${GITHUB_SHA::8}" .

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.ETERAPY_FLEET_DEPLOY_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::secret ETERAPY_FLEET_DEPLOY_KEY is empty"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship image + converge stack
        env:
          # Необязательный. Секрет — не потому что тайна (это @username'ы), а
          # потому что это единственный путь доставить значение на хост выкаткой.
          MINIAPP_TELEGRAM_ALLOWLIST: ${{ secrets.MINIAPP_TELEGRAM_ALLOWLIST }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes $VM_USER@$VM_HOST"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "deploy/compose/$COMPOSE_FILE_NAME" "$VM_USER@$VM_HOST:/tmp/$COMPOSE_FILE_NAME"
          $SSH "sudo mkdir -p $STAGING_DIR && sudo mv /tmp/$COMPOSE_FILE_NAME $STAGING_DIR/$COMPOSE_FILE_NAME"
          # Keep the hourly DB A/B refresh utility current (it flips the
          # staging DATABASE_URL and recreates these containers).
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/sync-staging-db-from-prod.sh "$VM_USER@$VM_HOST:/tmp/sync-staging-db-from-prod.sh"
          $SSH "mkdir -p /home/admin/eterapy-staging/deploy && mv /tmp/sync-staging-db-from-prod.sh /home/admin/eterapy-staging/deploy/sync-staging-db-from-prod.sh && chmod 755 /home/admin/eterapy-staging/deploy/sync-staging-db-from-prod.sh"
          # Reclaim space BEFORE loading (same rationale as prod deploy.yml):
          # drop every staging image except the running one and the incoming tag.
          $SSH "RUNNING=\$(sudo docker inspect --format '{{.Config.Image}}' eterapy-staging-web-1 2>/dev/null || true); \
            sudo docker images eterapy-web-staging --format '{{.Repository}}:{{.Tag}}' \
            | grep -v \"^\${RUNNING}\$\" | grep -v \"^eterapy-web-staging:${GITHUB_SHA::8}\$\" \
            | xargs -r sudo docker rmi 2>/dev/null || true; \
            sudo docker image prune -f >/dev/null 2>&1 || true"
          docker save "eterapy-web-staging:${GITHUB_SHA::8}" | gzip -1 | $SSH 'gunzip | sudo docker load'
          $SSH "sudo test -f $STAGING_DIR/.env || { echo 'staging .env missing — bootstrap it first (see deploy/compose/docker-compose.staging.yml)'; exit 1; }"
          # B566: список допущенных в стейджевый мини-апп приезжает выкаткой из
          # секрета репозитория, а не правится на хосте руками — ровно поэтому он
          # и не доехал в B554, оставив стенд с копией боевой базы открытым.
          # Значение идёт через stdin, а не в строку команды: в нём @username'ы
          # и запятые, и оно не должно попадать в shell. Секрет не задан —
          # ничего не пишем, стенд остаётся закрытым (fail closed).
          if [ -n "${MINIAPP_TELEGRAM_ALLOWLIST:-}" ]; then
            printf '%s\n' "$MINIAPP_TELEGRAM_ALLOWLIST" | $SSH "sudo sed -i '/^MINIAPP_TELEGRAM_ALLOWLIST=/d' $STAGING_DIR/.env \
              && read -r value \
              && printf 'MINIAPP_TELEGRAM_ALLOWLIST=%s\n' \"\$value\" | sudo tee -a $STAGING_DIR/.env >/dev/null"
            echo "▶ стейджевый allowlist обновлён из секрета"
          else
            echo "▶ MINIAPP_TELEGRAM_ALLOWLIST не задан — вход через Telegram на стенде закрыт (B566)"
          fi
          $SSH "sudo sed -i 's#^ETERAPY_IMAGE=.*#ETERAPY_IMAGE=eterapy-web-staging:${GITHUB_SHA::8}#' $STAGING_DIR/.env \
            && cd $STAGING_DIR && { sudo docker compose -f $COMPOSE_FILE_NAME up -d --remove-orphans || { echo 'compose up race — retry'; sleep 5; sudo docker compose -f $COMPOSE_FILE_NAME up -d --remove-orphans; }; } \
            && sudo docker image prune -f >/dev/null \
            && sudo docker compose -f $COMPOSE_FILE_NAME ps"
          echo "▶ worker health"
          sleep 5
          WORKER_STATUS=$($SSH "sudo docker inspect -f '{{.State.Status}}' eterapy-staging-worker-1" || echo missing)
          echo "eterapy-staging-worker container → $WORKER_STATUS"
          if [ "$WORKER_STATUS" != "running" ]; then
            $SSH "sudo docker logs eterapy-staging-worker-1 --tail 100" || true
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  verify:
    name: Health check (staging)
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /api/health (with retry)
        run: |
          set -euo pipefail
          sleep 10
          STATUS=000
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
            [ "$STATUS" = "200" ] && { echo "OK /api/health -> 200 (attempt $i)"; exit 0; }
            echo "attempt $i/30: status=$STATUS"
            sleep 6
          done
          echo "::error::staging /api/health failed (last: $STATUS)"
          exit 1

  notify:
    name: Notify Telegram
    needs: [test, deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: STAGING deploy
          EMOJI: "🧪"
          STAGES: |
            tests=${{ needs.test.result }}
            deploy=${{ needs.deploy.result }}
            health=${{ needs.verify.result }}
          GH_ACTOR: ${{ github.actor }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER: ${{ github.server_url }}
          # Multi-line and attacker-influenceable: stays in env, gets flattened
          # and HTML-escaped by the shared notifier.
          GH_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FIRST_LINE=$(printf '%s' "$GH_MSG" | head -n 1 | cut -c1-200)
          export FIELDS="Env=staging (container)
          Repo=$GH_REPO
          Branch=$GH_REF
          Commit=${GH_SHA:0:8}
          Image=eterapy-web-staging:${GH_SHA:0:8}
          Author=$GH_ACTOR
          Message=$FIRST_LINE"
          export EXTRA_LINKS="Commit=$GH_SERVER/$GH_REPO/commit/$GH_SHA
          Open staging=https://staging.app.eterapy.com"
          bash .github/scripts/telegram-notify.sh
        continue-on-error: true
