# B473 — staging deploy: same immutable-image flow as production (deploy.yml),
# pointed at the staging contour on eterapy-1 (/opt/eterapy-staging, port 3201,
# database eterapy_staging). The image is built with staging NEXT_PUBLIC_*
# domains; runtime secrets live only in the VM's /opt/eterapy-staging/.env —
# this workflow never receives prod runtime secrets.
name: Deploy to Staging

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/playwright.yml'
      - '.artifacts/**'
      - '.agents/**'
      - '.qwen/**'
      - '.claude/**'
      - '.gemini/**'
      - '.opencode/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip jest tests (emergency only)'
        required: false
        default: false
        type: boolean

# Staging deploys queue independently of production.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  VM_HOST: 192.144.14.146
  VM_USER: admin
  STAGING_DIR: /opt/eterapy-staging
  COMPOSE_FILE_NAME: docker-compose.staging.yml
  # Probe the app subdomain: it resolves directly to the VPS and /api/health is
  # exempt from Basic Auth.
  HEALTH_URL: https://staging.app.eterapy.com/api/health

jobs:
  test:
    name: Unit tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate
      - name: Run tests
        working-directory: web
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NODE_ENV: test
        run: npm test -- --ci --passWithNoTests --silent

  deploy:
    name: Build image & converge staging
    needs: test
    # B659: задача пушит образ релиза в ghcr.io. Токен прогона живёт ровно
    # столько, сколько идёт прогон, и на нодах не остаётся.
    permissions:
      contents: read
      packages: write
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build release image (staging domains)
        run: |
          docker build -f deploy/docker/Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL="https://staging.eterapy.com" \
            --build-arg NEXT_PUBLIC_USE_SUBDOMAINS="true" \
            --build-arg NEXT_PUBLIC_MAIN_DOMAIN="staging.eterapy.com" \
            --build-arg NEXT_PUBLIC_APP_DOMAIN="staging.app.eterapy.com" \
            --build-arg NEXT_PUBLIC_ADMIN_DOMAIN="staging.admin.eterapy.com" \
            --build-arg NEXT_PUBLIC_LIVEKIT_URL="" \
            --build-arg NEXT_PUBLIC_TELEGRAM_BOT_USERNAME="eterapy_staging_bot" \
            -t "eterapy-web-staging:${GITHUB_SHA::8}" .

      # B667 — размер образа виден в прогоне, а не только на хосте, где он уже
      # занял диск. Это цифра РАННЕРА, и она меньше той, что показывает хост:
      # учёт слоёв разный. Сверка с планкой 800 МБ — ниже, после доставки.
      - name: Report image size (runner accounting)
        run: |
          SIZE_MB=$(docker image inspect "eterapy-web-staging:${GITHUB_SHA::8}" --format '{{.Size}}' | awk '{printf "%d", $1/1024/1024}')
          echo "▶ образ на раннере: ${SIZE_MB} МБ (цифру для планки B667 даёт хост)"

      # B659 / INC-099 — образ раздаётся реестром, а не потоком по SSH.
      #
      # Замер 2026-08-04 на eterapy-1 в одну и ту же минуту: поток
      # `docker save | gzip | ssh` с раннера шёл 23–59 КБ/с, обычная загрузка
      # из CDN на той же ноде — 13.5 МБ/с. Разница в 230 раз, канал ноды
      # исправен. Три выкатки подряд были отменены по таймауту задачи в 30
      # минут. Все четыре ноды при этом достают ghcr.io за 0.13–0.27 с.
      #
      # Пуш не обязан удаться: если реестр недоступен, доставка уходит в
      # прежний путь по SSH. Шаг не имеет права уронить выкатку.
      - name: Push release image to registry
        id: registry
        continue-on-error: true
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eterapy-web-staging:${GITHUB_SHA::8}"
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "eterapy-web-staging:${GITHUB_SHA::8}" "$REF"
          docker push "$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "▶ образ в реестре: $REF"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.ETERAPY_FLEET_DEPLOY_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::secret ETERAPY_FLEET_DEPLOY_KEY is empty"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship image + converge stack
        env:
          # Необязательный. Секрет — не потому что тайна (это @username'ы), а
          # потому что это единственный путь доставить значение на хост выкаткой.
          MINIAPP_TELEGRAM_ALLOWLIST: ${{ secrets.MINIAPP_TELEGRAM_ALLOWLIST }}
          # B703: ключи бесплатных коннекторов LLM. Стенд получает их наравне с
          # продом — иначе замер на стенде проверял бы не тот контур, что едет
          # в бой. Тарифы бесплатные, чужих денег эти ключи не тратят.
          KILO_CODE_AI_API_KEY: ${{ secrets.KILO_CODE_AI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENCODE_ZEN_AI_API_KEY: ${{ secrets.OPENCODE_ZEN_AI_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          SAMBANOVA_CLOUD_API_KEY: ${{ secrets.SAMBANOVA_CLOUD_API_KEY }}
          POLLINATIONS_AI_API_KEY: ${{ secrets.POLLINATIONS_AI_API_KEY }}
          HUGGINGFACE_HUB_API_KEY: ${{ secrets.HUGGINGFACE_HUB_API_KEY }}
          # B659: пусто, если пуш в реестр не удался — тогда доставка идёт
          # прежним путём. Токен прогона, а не долгоживущий ключ на нодах.
          REGISTRY_REF: ${{ steps.registry.outputs.ref }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # B698 → 2026-08-11: keepalive обязателен на ОБОИХ контурах. Без него
          # клиент ждёт мёртвую сессию вечно: прогон 31492859955 провисел 20+
          # минут на `docker pull`, пока на хосте не шло ничего и ни один
          # процесс не работал. Боевой deploy.yml эту правку получил ещё в B698,
          # стейджевый — нет; расхождение молчаливое, поэтому его сторожит
          # прогон `production-runtime`.
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=180 $VM_USER@$VM_HOST"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "deploy/compose/$COMPOSE_FILE_NAME" "$VM_USER@$VM_HOST:/tmp/$COMPOSE_FILE_NAME"
          $SSH "sudo mkdir -p $STAGING_DIR && sudo mv /tmp/$COMPOSE_FILE_NAME $STAGING_DIR/$COMPOSE_FILE_NAME"
          # Keep the hourly DB A/B refresh utility current (it flips the
          # staging DATABASE_URL and recreates these containers).
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/sync-staging-db-from-prod.sh "$VM_USER@$VM_HOST:/tmp/sync-staging-db-from-prod.sh"
          $SSH "mkdir -p /home/admin/eterapy-staging/deploy && mv /tmp/sync-staging-db-from-prod.sh /home/admin/eterapy-staging/deploy/sync-staging-db-from-prod.sh && chmod 755 /home/admin/eterapy-staging/deploy/sync-staging-db-from-prod.sh"
          # INC-095: место освобождается ДО загрузки образа. Решение владельца
          # 2026-08-03: стенд не хранит предыдущих образов вовсе — он
          # пересобирается из develop за минуты, откатывать его нечего, а живёт
          # он на том же диске 30 GB, где боевой Postgres.
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/docker/retain-release-images.sh "$VM_USER@$VM_HOST:/tmp/retain-release-images.sh"
          $SSH "chmod +x /tmp/retain-release-images.sh \
            && /tmp/retain-release-images.sh eterapy-web-staging eterapy-staging-web-1 1 '${GITHUB_SHA::8}' 0"
          # B659: сначала пробуем реестр — нода тянет слои своим быстрым
          # каналом. Авторизация уходит через stdin (никогда строкой команды),
          # токен прогона на ноде не остаётся: `docker logout` в том же вызове.
          # Любая осечка — прежний путь потоком по SSH, он рабочий, просто
          # медленный и нестабильный.
          SHIPPED=no
          if [ -n "${REGISTRY_REF:-}" ]; then
            echo "▶ пробуем реестр: $REGISTRY_REF"
            if printf '%s' "$REGISTRY_TOKEN" | $SSH "sudo docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin \
              && sudo docker pull '$REGISTRY_REF' \
              && sudo docker tag '$REGISTRY_REF' 'eterapy-web-staging:${GITHUB_SHA::8}' \
              && sudo docker rmi '$REGISTRY_REF' \
              && sudo docker logout ghcr.io"; then
              SHIPPED=yes
              echo "▶ образ доставлен реестром"
            else
              echo "▶ реестр не сработал — уходим в поток по SSH"
              $SSH "sudo docker logout ghcr.io" || true
            fi
          fi
          if [ "$SHIPPED" != yes ]; then
            docker save "eterapy-web-staging:${GITHUB_SHA::8}" | gzip -1 | $SSH 'gunzip | sudo docker load'
          fi
          # B667 — размер меряется НА ХОСТЕ: там диск, который реально занят.
          # Планка 800 МБ — предупреждение, а не гейт.
          # `docker image inspect .Size` на нодах даёт СЖАТЫЙ размер (хранилище
          # containerd): 193 МБ там, где `docker images` показывает 799 МБ. Диск
          # занимает вторая цифра — её и берём, разбирая единицы измерения.
          size_mb() {
            awk -v s="$1" 'BEGIN {
              n = s; sub(/[A-Za-z]+$/, "", n);
              u = s; sub(/^[0-9.]+/, "", u);
              m = (u == "GB") ? 1024 : (u == "MB") ? 1 : (u == "kB" || u == "KB") ? 1/1024 : 1/1048576;
              printf "%d", n * m
            }'
          }
          HOST_SIZE_MB=$(size_mb "$($SSH "sudo docker image ls --filter reference=eterapy-web-staging:${GITHUB_SHA::8} --format '{{.Size}}'" | head -1)")
          echo "▶ образ на хосте: ${HOST_SIZE_MB} МБ (планка B667 — 800 МБ)"
          [ "${HOST_SIZE_MB:-0}" -le 800 ] || echo "::warning::образ ${HOST_SIZE_MB} МБ — выше планки B667 в 800 МБ"
          $SSH "sudo test -f $STAGING_DIR/.env || { echo 'staging .env missing — bootstrap it first (see deploy/compose/docker-compose.staging.yml)'; exit 1; }"
          # B566: список допущенных в стейджевый мини-апп приезжает выкаткой из
          # секрета репозитория, а не правится на хосте руками — ровно поэтому он
          # и не доехал в B554, оставив стенд с копией боевой базы открытым.
          # Значение идёт через stdin, а не в строку команды: в нём @username'ы
          # и запятые, и оно не должно попадать в shell. Секрет не задан —
          # ничего не пишем, стенд остаётся закрытым (fail closed).
          if [ -n "${MINIAPP_TELEGRAM_ALLOWLIST:-}" ]; then
            printf '%s\n' "$MINIAPP_TELEGRAM_ALLOWLIST" | $SSH "sudo sed -i '/^MINIAPP_TELEGRAM_ALLOWLIST=/d' $STAGING_DIR/.env \
              && read -r value \
              && printf 'MINIAPP_TELEGRAM_ALLOWLIST=%s\n' \"\$value\" | sudo tee -a $STAGING_DIR/.env >/dev/null"
            echo "▶ стейджевый allowlist обновлён из секрета"
          else
            echo "▶ MINIAPP_TELEGRAM_ALLOWLIST не задан — вход через Telegram на стенде закрыт (B566)"
          fi
          # B703: ключи коннекторов на бесплатных тарифах — тем же приёмом, что
          # на проде. Значение идёт через stdin: в ключах бывают символы, о
          # которые спотыкаются shell и sed. Секрет пуст → ключ не трогаем, и
          # коннектор просто не поднимается: выкатка от этого не падает.
          for key in KILO_CODE_AI_API_KEY NVIDIA_NIM_API_KEY \
                     OPENCODE_ZEN_AI_API_KEY TOKENROUTER_API_KEY \
                     SAMBANOVA_CLOUD_API_KEY POLLINATIONS_AI_API_KEY \
                     HUGGINGFACE_HUB_API_KEY; do
            eval "value=\${$key:-}"
            [ -n "$value" ] || continue
            printf '%s\n' "$value" | $SSH "sudo sed -i '/^$key=/d' $STAGING_DIR/.env \
              && read -r v \
              && printf '$key=%s\n' \"\$v\" | sudo tee -a $STAGING_DIR/.env >/dev/null"
            echo "▶ $key доставлен на стенд"
          done
          $SSH "sudo sed -i 's#^ETERAPY_IMAGE=.*#ETERAPY_IMAGE=eterapy-web-staging:${GITHUB_SHA::8}#' $STAGING_DIR/.env \
            && cd $STAGING_DIR && { sudo docker compose -f $COMPOSE_FILE_NAME up -d --remove-orphans || { echo 'compose up race — retry'; sleep 5; sudo docker compose -f $COMPOSE_FILE_NAME up -d --remove-orphans; }; } \
            && sudo docker image prune -f >/dev/null \
            && sudo docker compose -f $COMPOSE_FILE_NAME ps"
          # INC-095: после конвергенции известно, какой образ стал текущим —
          # вытесненный удаляется сразу, чтобы стенд не занимал 4.5 GB диска,
          # который нужен боевому Postgres.
          $SSH "/tmp/retain-release-images.sh eterapy-web-staging eterapy-staging-web-1 1 '' 0" \
            || echo "чистка образов стенда пропущена (не критично)"
          echo "▶ worker health"
          sleep 5
          WORKER_STATUS=$($SSH "sudo docker inspect -f '{{.State.Status}}' eterapy-staging-worker-1" || echo missing)
          echo "eterapy-staging-worker container → $WORKER_STATUS"
          if [ "$WORKER_STATUS" != "running" ]; then
            $SSH "sudo docker logs eterapy-staging-worker-1 --tail 100" || true
            exit 1
          fi
          MARKETING_STATUS=$($SSH "sudo docker inspect -f '{{.State.Status}}' eterapy-staging-marketing-agent-1" || echo missing)
          echo "eterapy-staging-marketing-agent container → $MARKETING_STATUS"
          if [ "$MARKETING_STATUS" != "running" ]; then
            $SSH "sudo docker logs eterapy-staging-marketing-agent-1 --tail 100" || true
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  verify:
    name: Health check (staging)
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /api/health (with retry)
        run: |
          set -euo pipefail
          sleep 10
          STATUS=000
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
            [ "$STATUS" = "200" ] && { echo "OK /api/health -> 200 (attempt $i)"; exit 0; }
            echo "attempt $i/30: status=$STATUS"
            sleep 6
          done
          echo "::error::staging /api/health failed (last: $STATUS)"
          exit 1

  notify:
    name: Notify Telegram
    needs: [test, deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: STAGING deploy
          EMOJI: "🧪"
          STAGES: |
            tests=${{ needs.test.result }}
            deploy=${{ needs.deploy.result }}
            health=${{ needs.verify.result }}
          GH_ACTOR: ${{ github.actor }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER: ${{ github.server_url }}
          # Multi-line and attacker-influenceable: stays in env, gets flattened
          # and HTML-escaped by the shared notifier.
          GH_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FIRST_LINE=$(printf '%s' "$GH_MSG" | head -n 1 | cut -c1-200)
          export FIELDS="Env=staging (container)
          Repo=$GH_REPO
          Branch=$GH_REF
          Commit=${GH_SHA:0:8}
          Image=eterapy-web-staging:${GH_SHA:0:8}
          Author=$GH_ACTOR
          Message=$FIRST_LINE"
          export EXTRA_LINKS="Commit=$GH_SERVER/$GH_REPO/commit/$GH_SHA
          Open staging=https://staging.app.eterapy.com"
          bash .github/scripts/telegram-notify.sh
        continue-on-error: true
