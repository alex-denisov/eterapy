name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.artifacts/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - id: cache-keys
        run: echo "deps=node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ steps.cache-keys.outputs.deps }}
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
        run: npx prisma generate

  test:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Reinstall if cache miss
        run: |
          if [ ! -d node_modules ] || [ ! -d web/node_modules ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
      - name: Ensure Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
        run: npx prisma generate
      - name: Run tests
        working-directory: web
        env:
          # Jest never hits a live DB — a syntactically valid URL is enough.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
          NODE_ENV: test
        run: npm test -- --ci --passWithNoTests --silent

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Reinstall if cache miss
        run: |
          if [ ! -d node_modules ] || [ ! -d web/node_modules ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
      - name: Oxlint fast pre-pass (pilot)
        continue-on-error: true
        working-directory: web
        run: npm run lint:fast
      - name: ESLint release gate
        working-directory: web
        run: npm run lint

  build:
    name: Next.js build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Reinstall if cache miss
        run: |
          if [ ! -d node_modules ] || [ ! -d web/node_modules ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
      - name: Ensure Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
        run: npx prisma generate
      - uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('web/src/**/*.{ts,tsx,js,jsx,css}', 'web/public/**', 'web/next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Build (verify only, no deploy)
        working-directory: web
        env:
          # Build-verification needs no real secrets (proven by the Docker
          # release image, which builds with dummies) — runtime env lives on
          # the VMs only.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          AUTH_TRUST_HOST: 'true'
          NEXT_PUBLIC_APP_URL: 'https://eterapy.com'
          NEXT_PUBLIC_USE_SUBDOMAINS: 'true'
          NEXT_PUBLIC_PRIMARY_DOMAIN_ONLY: 'false'
          NEXT_PUBLIC_MAIN_DOMAIN: 'eterapy.com'
          NEXT_PUBLIC_APP_DOMAIN: 'app.eterapy.com'
          NEXT_PUBLIC_ADMIN_DOMAIN: 'admin.eterapy.com'
          NEXT_PUBLIC_LIVEKIT_URL: 'wss://eterapy.com:7880'
          NODE_ENV: production
        run: npm run build

  devvit:
    name: Reddit Devvit companion
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: eterapy-smm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: eterapy-smm/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm test

  # PR pipelines used to be silent on Telegram, so a red CI only ever showed up
  # as a GitHub e-mail while the chat kept reporting green deploys. Same rich
  # block as staging/production now.
  notify:
    name: Notify Telegram
    needs: [install, test, lint, build, devvit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: CI (pull request)
          EMOJI: "🤖"
          STAGES: |
            install=${{ needs.install.result }}
            test=${{ needs.test.result }}
            lint=${{ needs.lint.result }}
            build=${{ needs.build.result }}
            devvit=${{ needs.devvit.result }}
          # Untrusted PR-controlled values stay in env — never interpolated
          # into the shell command line.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export FIELDS="Env=pull request
          Repo=$GH_REPO
          PR=#$PR_NUMBER — $PR_TITLE
          Branch=$PR_BRANCH
          Commit=${PR_SHA:0:8}
          Author=$PR_AUTHOR"
          export EXTRA_LINKS="Open PR=$PR_URL"
          bash .github/scripts/telegram-notify.sh
