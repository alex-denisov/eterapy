name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.artifacts/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - id: cache-keys
        run: echo "deps=node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ steps.cache-keys.outputs.deps }}
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
        run: npx prisma generate

  test:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Reinstall if cache miss
        run: |
          if [ ! -d node_modules ] || [ ! -d web/node_modules ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
      - name: Ensure Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
        run: npx prisma generate
      - name: Run tests
        working-directory: web
        env:
          # Jest never hits a live DB — a syntactically valid URL is enough.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
          NODE_ENV: test
        run: npm test -- --ci --passWithNoTests --silent

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Reinstall if cache miss
        run: |
          if [ ! -d node_modules ] || [ ! -d web/node_modules ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
      - name: Oxlint fast pre-pass (pilot)
        continue-on-error: true
        working-directory: web
        run: npm run lint:fast
      - name: ESLint release gate
        working-directory: web
        run: npm run lint

  build:
    name: Next.js build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/cache@v5
        with:
          path: |
            node_modules
            web/node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Reinstall if cache miss
        run: |
          if [ ! -d node_modules ] || [ ! -d web/node_modules ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
      - name: Ensure Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eterapy_ci
        run: npx prisma generate
      - uses: actions/cache@v5
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('web/src/**/*.{ts,tsx,js,jsx,css}', 'web/public/**', 'web/next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Build (verify only, no deploy)
        working-directory: web
        env:
          # Build-verification needs no real secrets (proven by the Docker
          # release image, which builds with dummies) — runtime env lives on
          # the VMs only.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          AUTH_TRUST_HOST: 'true'
          NEXT_PUBLIC_APP_URL: 'https://eterapy.com'
          NEXT_PUBLIC_USE_SUBDOMAINS: 'true'
          NEXT_PUBLIC_PRIMARY_DOMAIN_ONLY: 'false'
          NEXT_PUBLIC_MAIN_DOMAIN: 'eterapy.com'
          NEXT_PUBLIC_APP_DOMAIN: 'app.eterapy.com'
          NEXT_PUBLIC_ADMIN_DOMAIN: 'admin.eterapy.com'
          NEXT_PUBLIC_LIVEKIT_URL: 'wss://eterapy.com:7880'
          NODE_ENV: production
        run: npm run build
