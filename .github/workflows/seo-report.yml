# B552/B553/B572 — SEO digest to Telegram, РУЧНОЙ запуск.
#
# Расписание отсюда снято. GitHub Actions выполняет `schedule` как получится:
# по этому же репозиторию почасовой sync-staging-db за сутки отработал 12 раз
# из 25, с опозданиями до 1ч55м. Владелец ждал отчёт в 09:00 и не получил его
# вовсе (2026-07-22). Ежедневный отчёт теперь шлёт systemd-таймер primary-ноды
# — deploy/seo/eterapy-seo-report.timer, ставится выкаткой.
#
# Здесь остаётся кнопка «прогнать сейчас»: удобно проверить креды и формат,
# не дожидаясь 09:00 и не заходя на ноду. Триггер только workflow_dispatch,
# пользовательского ввода нет — интерполировать в shell нечего.
#
# Secrets: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID +
# YANDEX_OAUTH_TOKEN / YANDEX_WORDSTAT_API_KEY / YANDEX_CLOUD_FOLDER_ID.
name: SEO Report

on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and send report
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_ID }}
        # Идентификаторы площадок — умолчания внутри скрипта, чтобы у ноды и у
        # workflow не было двух расходящихся копий. Файла /opt/eterapy/.env на
        # раннере нет, поэтому креды берутся только из env выше.
        run: bash deploy/seo/seo-telegram-report.sh
