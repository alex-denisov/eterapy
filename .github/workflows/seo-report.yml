# B552/B553 — SEO digest to Telegram, twice a week at 09:00 MSK (06:00 UTC).
# Secrets: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (already present) +
# YANDEX_OAUTH_TOKEN / YANDEX_WORDSTAT_API_KEY / YANDEX_CLOUD_FOLDER_ID.
name: SEO Report

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and send report
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_ID }}
          YANDEX_WEBMASTER_USER_ID: '253574184'
          YANDEX_WEBMASTER_HOST_ID: 'https:eterapy.com:443'
          YANDEX_METRIKA_COUNTER_ID: '108502034'
        run: bash .github/scripts/seo-telegram-report.sh
