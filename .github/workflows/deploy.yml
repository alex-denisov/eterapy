name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  # ========== STAGE 1: TEST & LINT ==========
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./web
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Run linter
        if: ${{ !inputs.skip_tests }}
        working-directory: ./web
        run: npm run lint

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        working-directory: ./web
        run: npm test -- --passWithNoTests

  # ========== STAGE 2: BUILD ==========
  build:
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./web
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Build application
        working-directory: ./web
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: web/.next/
          retention-days: 1

  # ========== STAGE 3: DEPLOY ==========
  deploy:
    needs: [test, build]
    if: always() && (needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: web/.next/

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.CLOUDRU_ETERAPY_WEB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.144.14.146 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            -e 'ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='node_modules' --exclude='.git' \
            --exclude='public/uploads' \
            ./web/ admin@192.144.14.146:/home/admin/eterapy/web/

      - name: Restart application on VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes admin@192.144.14.146 '
            set -euxo pipefail
            cd /home/admin/eterapy/web
            source /home/admin/db-creds.txt
            export DATABASE_URL
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            pm2 startOrReload /home/admin/eterapy/deploy/ecosystem.config.js --update-env
            pm2 save
          '

      - name: Verify deployment
        id: verify
        run: |
          echo "Waiting for application to start..."
          sleep 10
          
          HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://eterapy.com/api/health || echo "000")
          APP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://app.eterapy.com || echo "000")
          ADMIN_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://admin.eterapy.com || echo "000")
          
          echo "Health endpoint: $HEALTH_STATUS"
          echo "App endpoint: $APP_STATUS"
          echo "Admin endpoint: $ADMIN_STATUS"
          
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "❌ Health check failed (status: $HEALTH_STATUS)"
            exit 1
          fi
          
          if [ "$APP_STATUS" != "200" ] && [ "$APP_STATUS" != "307" ] && [ "$APP_STATUS" != "308" ]; then
            echo "❌ App check failed (status: $APP_STATUS)"
            exit 1
          fi
          
          if [ "$ADMIN_STATUS" != "200" ] && [ "$ADMIN_STATUS" != "307" ] && [ "$ADMIN_STATUS" != "308" ]; then
            echo "❌ Admin check failed (status: $ADMIN_STATUS)"
            exit 1
          fi
          
          echo "✅ All deployment checks passed!"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ========== STAGE 4: NOTIFICATIONS (per job) ==========
  notify-test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram not configured. Skipping notification."
            exit 0
          fi
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          RESULT="${{ needs.test.result }}"
          if [ "$RESULT" = "success" ]; then
            MSG="✅ Eterapy Tests PASSED%0ACommit: $SHA%0ABranch: $REF%0AActor: $ACTOR"
          else
            MSG="❌ Eterapy Tests FAILED%0ACommit: $SHA%0ABranch: $REF%0AActor: $ACTOR%0ALogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          # Convert %0A to actual newline
          MSG=$(echo "$MSG" | awk '{ gsub(/%0A/, "\n"); print }')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification skipped"

  notify-build:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram not configured. Skipping notification."
            exit 0
          fi
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          RESULT="${{ needs.build.result }}"
          if [ "$RESULT" = "success" ]; then
            MSG="✅ Eterapy Build PASSED%0ACommit: $SHA%0ABranch: $REF%0AActor: $ACTOR"
          else
            MSG="❌ Eterapy Build FAILED%0ACommit: $SHA%0ABranch: $REF%0AActor: $ACTOR%0ALogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          MSG=$(echo "$MSG" | awk '{ gsub(/%0A/, "\n"); print }')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification skipped"

  notify-deploy:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram not configured. Skipping notification."
            exit 0
          fi
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          RESULT="${{ needs.deploy.result }}"
          if [ "$RESULT" = "success" ]; then
            MSG="✅ Eterapy Deploy SUCCESS%0ACommit: $SHA%0ABranch: $REF%0AActor: $ACTOR"
          else
            MSG="❌ Eterapy Deploy FAILED%0ACommit: $SHA%0ABranch: $REF%0AActor: $ACTOR%0ALogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          MSG=$(echo "$MSG" | awk '{ gsub(/%0A/, "\n"); print }')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification skipped"

  notify-build:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram not configured. Skipping notification."
            exit 0
          fi
          if [ "${{ needs.build.result }}" = "success" ]; then
            MESSAGE="✅ ETerapy Build PASSED%0ACommit: ${{ github.sha }}%0ABranch: ${{ github.ref_name }}%0AActor: ${{ github.actor }}"
          else
            MESSAGE="❌ ETerapy Build FAILED%0ACommit: ${{ github.sha }}%0ABranch: ${{ github.ref_name }}%0AActor: ${{ github.actor }}%0ALogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          MESSAGE=$(echo "$MESSAGE" | sed 's/%0A/\n/g')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification skipped"

  notify-deploy:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️ Telegram not configured. Skipping notification."
            exit 0
          fi
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            MESSAGE="✅ ETerapy Deploy SUCCESS%0ACommit: ${{ github.sha }}%0ABranch: ${{ github.ref_name }}%0AActor: ${{ github.actor }}"
          else
            MESSAGE="❌ ETerapy Deploy FAILED%0ACommit: ${{ github.sha }}%0ABranch: ${{ github.ref_name }}%0AActor: ${{ github.actor }}%0ALogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          MESSAGE=$(echo "$MESSAGE" | sed 's/%0A/\n/g')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification skipped"
