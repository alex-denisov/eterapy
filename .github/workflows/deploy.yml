name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  # ========== STAGE 1: TEST & LINT ==========
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run linter
        if: ${{ !inputs.skip_tests }}
        working-directory: ./web
        run: npm run lint

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        working-directory: ./web
        run: npm test -- --passWithNoTests

  # ========== STAGE 2: BUILD ==========
  build:
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build application
        working-directory: ./web
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: web/.next/
          retention-days: 1

  # ========== STAGE 3: DEPLOY ==========
  deploy:
    needs: [test, build]
    if: always() && (needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: web/.next/

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.CLOUDRU_ETERAPY_WEB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.144.14.146 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            -e 'ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='node_modules' --exclude='.git' \
            --exclude='public/uploads' \
            ./web/ admin@192.144.14.146:/home/admin/eterapy/web/

      - name: Restart application on VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes admin@192.144.14.146 '
            set -euxo pipefail
            cd /home/admin/eterapy/web
            source /home/admin/db-creds.txt
            export DATABASE_URL
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            pm2 startOrReload /home/admin/eterapy/deploy/ecosystem.config.js --update-env
            pm2 save
          '

      - name: Verify deployment
        id: verify
        run: |
          echo "Waiting for application to start..."
          sleep 10
          
          HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://eterapy.com/api/health || echo "000")
          APP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://app.eterapy.com || echo "000")
          ADMIN_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://admin.eterapy.com || echo "000")
          
          echo "Health endpoint: $HEALTH_STATUS"
          echo "App endpoint: $APP_STATUS"
          echo "Admin endpoint: $ADMIN_STATUS"
          
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "❌ Health check failed (status: $HEALTH_STATUS)"
            exit 1
          fi
          
          if [ "$APP_STATUS" != "200" ] && [ "$APP_STATUS" != "307" ] && [ "$APP_STATUS" != "308" ]; then
            echo "❌ App check failed (status: $APP_STATUS)"
            exit 1
          fi
          
          if [ "$ADMIN_STATUS" != "200" ] && [ "$ADMIN_STATUS" != "307" ] && [ "$ADMIN_STATUS" != "308" ]; then
            echo "❌ Admin check failed (status: $ADMIN_STATUS)"
            exit 1
          fi
          
          echo "✅ All deployment checks passed!"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ========== STAGE 4: NOTIFICATION (Telegram) ==========
  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Set notification message
        id: message
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "text=✅ ETerapy Deploy SUCCESS!%0ACommit: ${{ github.sha }}%0ABranch: ${{ github.ref_name }}%0AAuthor: ${{ github.actor }}" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "text=❌ ETerapy Deploy FAILED!%0ACommit: ${{ github.sha }}%0ABranch: ${{ github.ref_name }}%0AAuthor: ${{ github.actor }}%0ACheck logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.message.outputs.text }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification skipped"

      - name: Fallback notification (console)
        if: env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == ''
        run: |
          echo "ℹ️ Telegram not configured. Skipping notification."
          echo "To enable notifications, add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to GitHub Secrets."
