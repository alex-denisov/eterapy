# B473 — production deploy: immutable image built in CI, streamed to the VM,
# converged by docker compose. Replaces the rsync+PM2 pipeline (cutover
# 2026-07-18; rollback = repin the previous SHA image, or switch the nginx
# upstream back to the PM2 port while PM2 is kept installed).
# Secrets used: CLOUDRU_ETERAPY_WEB_DEPLOY_KEY (SSH) + optional Telegram pair.
name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/sync-staging-db.yml'
      - '.github/workflows/playwright.yml'
      - '.github/workflows/deploy-test-vm.yml'
      - 'deploy/*staging*'
      - 'deploy/telegram-proxy*'
      - '.artifacts/**'
      - '.agents/**'
      - '.qwen/**'
      - '.claude/**'
      - '.gemini/**'
      - '.opencode/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip jest tests (emergency only)'
        required: false
        default: false
        type: boolean
      # B541 — one-click redeploy from the superadmin panel dispatches this
      # workflow with node slugs (or "all"). Never interpolated into `run:` —
      # it is passed through env and matched against the fixed slug list.
      nodes:
        description: 'Nodes to deploy: "all" or comma-separated slugs (eterapy-1,eterapy-4)'
        required: false
        default: 'all'
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  VM_USER: admin
  VM_HOST: 192.144.14.146
  HEALTH_URL: https://eterapy.com/api/health
  APP_URL: https://app.eterapy.com
  ADMIN_URL: https://admin.eterapy.com

jobs:
  test:
    name: Unit tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Prisma client
        working-directory: web
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate
      - name: Run tests
        working-directory: web
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NODE_ENV: test
        run: npm test -- --ci --passWithNoTests --silent

  # B541 — the fleet inventory lives in deploy/fleet-matrix.json (single source
  # of truth, also read by the superadmin monitoring panel). This job filters it
  # by the `nodes` dispatch input so a one-click redeploy can target one host.
  plan:
    name: Select fleet nodes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vms: ${{ steps.select.outputs.vms }}
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
      # B627: два разных бота, и путать их нельзя.
      #
      #  * @eterapy_bot — продуктовый: Mini App, вход, платежи Stars. Его токен
      #    едет на ноды в `.env` и обслуживает пользователей.
      #  * @eterapy_deploy_bot — служебный: пишет в канал выкатки. Наружу к
      #    пользователям он не ходит вовсе.
      #
      # До этой правки уведомления о выкатке слал продуктовый бот — владелец
      # 2026-07-30 заметил это как раз тогда, когда деплой-бота взломали и
      # рассылали через него рекламу. Проверка личности теперь у обоих: чужой
      # токен в любом из двух секретов останавливает выкатку до внешних вызовов.
      - name: Verify Telegram bot identities
        env:
          TG_PRODUCT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_DEPLOY_TOKEN: ${{ secrets.TELEGRAM_DEPLOY_BOT_TOKEN }}
        run: |
          set -euo pipefail
          verify() {
            local token="$1" expected="$2" secret="$3"
            [ -n "$token" ] || { echo "::error::$secret is missing"; exit 1; }
            local response username
            response=$(curl -fsS --retry 2 --max-time 15 "https://api.telegram.org/bot${token}/getMe")
            username=$(printf '%s' "$response" | jq -r 'select(.ok == true) | .result.username // empty')
            if [ "$username" != "$expected" ]; then
              echo "::error::$secret must belong to @$expected; received @${username:-unknown}"
              exit 1
            fi
            echo "@$expected identity verified"
          }
          verify "$TG_PRODUCT_TOKEN" "eterapy_bot" "TELEGRAM_BOT_TOKEN"
          verify "$TG_DEPLOY_TOKEN" "eterapy_deploy_bot" "TELEGRAM_DEPLOY_BOT_TOKEN"
      - id: select
        # NODES is untrusted (dispatch input): it is only ever compared against
        # the fixed slug list by jq, never interpolated into a shell command.
        env:
          NODES: ${{ inputs.nodes }}
        run: |
          set -euo pipefail
          selection="${NODES:-all}"
          if [ "$selection" = "all" ] || [ -z "$selection" ]; then
            vms=$(jq -c '.' deploy/fleet-matrix.json)
          else
            vms=$(jq -c --arg sel "$selection" \
              '($sel | split(",") | map(gsub("^\\s+|\\s+$";""))) as $want
               | map(select(.slug as $s | $want | index($s)))' \
              deploy/fleet-matrix.json)
          fi
          if [ "$(printf '%s' "$vms" | jq 'length')" -eq 0 ]; then
            echo "::error::No fleet node matched the requested selection"
            exit 1
          fi
          {
            echo "vms=$vms"
            echo "selection=$selection"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.vm.name }}
    needs: [test, plan]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vm: ${{ fromJSON(needs.plan.outputs.vms) }}
    env:
      VM_HOST: ${{ matrix.vm.host }}
      VM_USER: ${{ matrix.vm.user }}
      COMPOSE_FILE_NAME: ${{ matrix.vm.compose }}
      PROFILE_ARGS: ${{ matrix.vm.profile_args }}
      NODE_SLUG: ${{ matrix.vm.slug }}
      # B537: standby nodes carry a read-only replica of eterapy-1.
      NODE_STANDBY: ${{ matrix.vm.standby && '1' || '0' }}
      # B572: роль ноды — по ней включается таймер SEO-отчёта (ровно на одной).
      NODE_ROLE: ${{ matrix.vm.role }}
      # B572: WireGuard-адрес ноды, на котором её слышит панель мониторинга.
      # Пусто на foreign-нодах — они в мост флота не входят. Значение приходит
      # из репозиторного deploy/fleet-matrix.json, не из события, и дальше
      # используется только как "$NODE_WEB_BIND" внутри run.
      NODE_WEB_BIND: ${{ matrix.vm.webBind }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release image (prod domains)
        run: |
          docker build -f deploy/docker/Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL="https://eterapy.com" \
            --build-arg NEXT_PUBLIC_USE_SUBDOMAINS="true" \
            --build-arg NEXT_PUBLIC_MAIN_DOMAIN="eterapy.com" \
            --build-arg NEXT_PUBLIC_APP_DOMAIN="app.eterapy.com" \
            --build-arg NEXT_PUBLIC_ADMIN_DOMAIN="admin.eterapy.com" \
            --build-arg NEXT_PUBLIC_LIVEKIT_URL="wss://app.eterapy.com" \
            --build-arg NEXT_PUBLIC_YANDEX_METRIKA_ID="108502034" \
            -t "eterapy-web:${GITHUB_SHA::8}" .

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.ETERAPY_FLEET_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship image + converge stack
        env:
          # B423: пока эти секреты не заведены, шаг доставки их пропускает и
          # рельс остаётся выключенным — `cardPaymentAvailable()` = false,
          # интерфейс честно говорит «скоро». Порядок включения — в тикете B423.
          ROBOKASSA_MERCHANT_LOGIN: ${{ secrets.ROBOKASSA_MERCHANT_LOGIN }}
          ROBOKASSA_PASSWORD_1: ${{ secrets.ROBOKASSA_PASSWORD_1 }}
          ROBOKASSA_PASSWORD_2: ${{ secrets.ROBOKASSA_PASSWORD_2 }}
          ROBOKASSA_TEST_PASSWORD_1: ${{ secrets.ROBOKASSA_TEST_PASSWORD_1 }}
          ROBOKASSA_TEST_PASSWORD_2: ${{ secrets.ROBOKASSA_TEST_PASSWORD_2 }}
          ROBOKASSA_HASH_ALGORITHM: ${{ secrets.ROBOKASSA_HASH_ALGORITHM }}
          ROBOKASSA_IS_TEST: ${{ secrets.ROBOKASSA_IS_TEST }}
          PAYMENT_PROVIDER: ${{ secrets.PAYMENT_PROVIDER }}
          # B529: курс звезды Telegram (₽ за 1 XTR). Не задан — берётся
          # задокументированный запасной курс из `payments/telegram-stars.ts`.
          # Меняется настройкой, потому что Telegram меняет цену пачки звёзд, а
          # сторы удерживают свою долю: вшитое число устареет молча.
          TELEGRAM_STARS_RUB_RATE: ${{ secrets.TELEGRAM_STARS_RUB_RATE }}
          # B569: ключи Cloudflare для панели мониторинга флота.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # B572: PAT (fine-grained, actions:write) для кнопки редеплоя в панели.
          # Пока секрет не заведён, панель честно пишет «деплой выключен».
          FLEET_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
          # B572: SEO-отчёт переехал с расписания GitHub Actions на systemd-таймер
          # ноды — GitHub роняет и опаздывает на часы (замер в тикете).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # B627: группа обсуждений маркетингового канала. Без её id бот не
          # видит ни одного комментария к постам канала — у самого канала
          # комментариев нет вовсе, они живут в связанной группе (B618).
          TELEGRAM_ETERAPY_CHAT_ID: ${{ secrets.TELEGRAM_ETERAPY_CHAT_ID }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_WORDSTAT_API_KEY: ${{ secrets.YANDEX_WORDSTAT_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_ID }}
          # B616/INC-093: маркетинговые коннекторы читают значение из настроек
          # суперадминки, а при её пустоте — из окружения. Раньше ID канала жил
          # только на машине владельца, поэтому Telegram-коннектор в панели
          # выглядел ненастроенным при рабочем боте. Секрет пуст → ключ не
          # трогаем, коннектор просто остаётся выключенным.
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_SUBREDDITS: ${{ secrets.REDDIT_SUBREDDITS }}
          REDDIT_POST_SUBREDDIT: ${{ secrets.REDDIT_POST_SUBREDDIT }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes $VM_USER@$VM_HOST"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "deploy/compose/$COMPOSE_FILE_NAME" "$VM_USER@$VM_HOST:/tmp/$COMPOSE_FILE_NAME"
          $SSH "sudo mkdir -p /opt/eterapy && sudo mv /tmp/$COMPOSE_FILE_NAME /opt/eterapy/$COMPOSE_FILE_NAME"
          # B542: the LiveKit overlay travels with every deploy so nodes whose
          # matrix profile_args reference it (-f docker-compose.livekit.yml)
          # always converge from the repo copy. The node's livekit.yaml
          # (contour secret) is host state and is NOT shipped.
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy/compose/docker-compose.livekit.yml "$VM_USER@$VM_HOST:/tmp/docker-compose.livekit.yml"
          $SSH "sudo mv /tmp/docker-compose.livekit.yml /opt/eterapy/docker-compose.livekit.yml"
          # B536: the backup script and its systemd units travel with every
          # deploy too. They used to be installed only by deploy/compose/
          # bootstrap.sh, which runs once when a node is provisioned — so any
          # later edit to offhost-backup.sh silently never reached the fleet
          # and would have had to be copied by hand. Node-local state
          # (backup.env, rclone.conf) is NOT shipped.
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/backup/offhost-backup.sh \
            deploy/backup/eterapy-backup.service \
            deploy/backup/eterapy-backup.timer \
            "$VM_USER@$VM_HOST:/tmp/"
          $SSH "sudo install -m 0755 /tmp/offhost-backup.sh /opt/eterapy/offhost-backup.sh \
            && sudo install -m 0644 /tmp/eterapy-backup.service /etc/systemd/system/eterapy-backup.service \
            && sudo install -m 0644 /tmp/eterapy-backup.timer /etc/systemd/system/eterapy-backup.timer \
            && rm -f /tmp/offhost-backup.sh /tmp/eterapy-backup.service /tmp/eterapy-backup.timer \
            && sudo systemctl daemon-reload \
            && if sudo systemctl is-enabled eterapy-backup.timer >/dev/null 2>&1; then \
                 sudo systemctl restart eterapy-backup.timer; \
                 echo 'backup timer reloaded'; \
               else \
                 echo 'backup timer not enabled on this node — files staged only'; \
               fi"
          # B572: WG-приёмник :3200 для панели мониторинга. Нужен ТОЛЬКО там,
          # где веб в host-сети: Next слушает ровно один адрес (`--hostname`),
          # он занят под 127.0.0.1 для host-nginx, а 0.0.0.0 недопустим —
          # файрвола на хостах нет. Где порт публикует docker, адрес задаёт
          # ETERAPY_WEB_BIND и прокси не нужен. Условие читаем прямо из
          # compose-файла ноды, чтобы оно не разъехалось с матрицей.
          if [ -n "$NODE_WEB_BIND" ] && grep -q 'network_mode: host' "deploy/compose/$COMPOSE_FILE_NAME"; then
            sed "s/__WG_BIND__/$NODE_WEB_BIND/" deploy/agent/eterapy-wg-proxy.socket > /tmp/eterapy-wg-proxy.socket
            scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              /tmp/eterapy-wg-proxy.socket \
              deploy/agent/eterapy-wg-proxy.service \
              "$VM_USER@$VM_HOST:/tmp/"
            $SSH "sudo install -m 0644 /tmp/eterapy-wg-proxy.socket /etc/systemd/system/eterapy-wg-proxy.socket \
              && sudo install -m 0644 /tmp/eterapy-wg-proxy.service /etc/systemd/system/eterapy-wg-proxy.service \
              && rm -f /tmp/eterapy-wg-proxy.socket /tmp/eterapy-wg-proxy.service \
              && sudo systemctl daemon-reload \
              && sudo systemctl enable eterapy-wg-proxy.socket \
              && sudo systemctl restart eterapy-wg-proxy.socket \
              && sudo systemctl is-active eterapy-wg-proxy.socket"
            echo "▶ WG-приёмник слушает $NODE_WEB_BIND:3200"
          else
            echo "▶ WG-приёмник не нужен на этой ноде"
          fi
          # B572: SEO-отчёт. Таймер поднимается ТОЛЬКО на primary — иначе
          # владелец получит столько отчётов, сколько нод во флоте. Скрипт
          # кладём на все ноды: он безвреден без таймера, а при смене primary
          # достаточно поменять роль в матрице.
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/seo/seo-telegram-report.sh \
            deploy/seo/eterapy-seo-report.service \
            deploy/seo/eterapy-seo-report.timer \
            "$VM_USER@$VM_HOST:/tmp/"
          $SSH "sudo install -m 0755 /tmp/seo-telegram-report.sh /opt/eterapy/seo-telegram-report.sh \
            && sudo install -m 0644 /tmp/eterapy-seo-report.service /etc/systemd/system/eterapy-seo-report.service \
            && sudo install -m 0644 /tmp/eterapy-seo-report.timer /etc/systemd/system/eterapy-seo-report.timer \
            && rm -f /tmp/seo-telegram-report.sh /tmp/eterapy-seo-report.service /tmp/eterapy-seo-report.timer \
            && sudo systemctl daemon-reload"
          if [ "$NODE_ROLE" = "primary" ]; then
            $SSH "sudo systemctl enable --now eterapy-seo-report.timer \
              && sudo systemctl list-timers eterapy-seo-report.timer --no-pager | head -2"
            echo "▶ SEO-отчёт: таймер включён (09:00 МСК)"
          else
            $SSH "sudo systemctl disable --now eterapy-seo-report.timer >/dev/null 2>&1 || true"
            echo "▶ SEO-отчёт: не primary — таймер выключен"
          fi
          # INC-080: конфиг контурного балансировщика тоже едет выкаткой. До
          # сих пор haproxy.cfg ставился руками (deploy/lb/README.md) — то есть
          # правка в репозитории могла молча не доехать до ноды, ровно как это
          # было с offhost-backup.sh. Порядок здесь важнее краткости:
          #   1. кладём кандидат во временный файл, живой конфиг не трогаем;
          #   2. проверяем его `haproxy -c` в ОДНОРАЗОВОМ контейнере с тем же
          #      образом и тем же .env ноды — битый конфиг не доживает до
          #      живого LB, цена ошибки здесь весь контур;
          #   3. кладём файл, только если он ОТЛИЧАЕТСЯ — иначе не трогаем даже
          #      его mtime;
          #   4. перезапускаем, если конфиг НОВЕЕ запущенного процесса.
          # Пункт 4 — не педантизм. Первый заход (батч №19) сравнивал файлы и
          # звал `compose up -d`: compose увидел ту же картинку, тот же compose
          # и те же переменные и ничего не сделал — конфиг лежит bind-mount'ом,
          # про его содержимое compose не знает вовсе. Выкатка отрапортовала
          # «перезапущен», а HAProxy восемь дней держал старый разбор. Сравнение
          # mtime файла со временем старта контейнера чинит и это, и правку
          # конфига руками на ноде.
          # Нода без /opt/eterapy/lb/.env — не LB-нода: файлы просто лежат.
          # Все значения здесь — из репозитория и из .env ноды; ничего из
          # события GitHub в шелл не подставляется.
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            deploy/lb/haproxy.cfg \
            deploy/lb/docker-compose.lb.yml \
            "$VM_USER@$VM_HOST:/tmp/"
          $SSH "set -e
            if [ ! -f /opt/eterapy/lb/.env ]; then
              rm -f /tmp/haproxy.cfg /tmp/docker-compose.lb.yml
              echo 'LB: нода не балансировщик — пропуск'
              exit 0
            fi
            set -a; . /opt/eterapy/lb/.env; set +a
            sudo -E docker run --rm \
              -e LB_NODE_A -e LB_NODE_B -e LB_BIND_PORT -e LB_STATS_PORT \
              -e LB_LIVEKIT_PORT -e LB_LIVEKIT_NODE_A -e LB_LIVEKIT_NODE_B \
              -v /tmp/haproxy.cfg:/tmp/candidate.cfg:ro \
              haproxy:2.9-alpine haproxy -c -f /tmp/candidate.cfg
            sudo cmp -s /tmp/haproxy.cfg /opt/eterapy/lb/haproxy.cfg \
              || sudo install -m 0644 /tmp/haproxy.cfg /opt/eterapy/lb/haproxy.cfg
            sudo cmp -s /tmp/docker-compose.lb.yml /opt/eterapy/lb/docker-compose.lb.yml \
              || sudo install -m 0644 /tmp/docker-compose.lb.yml /opt/eterapy/lb/docker-compose.lb.yml
            rm -f /tmp/haproxy.cfg /tmp/docker-compose.lb.yml
            cd /opt/eterapy/lb
            sudo docker compose -f docker-compose.lb.yml --profile lb up -d
            CFG_AT=\$(stat -c %Y haproxy.cfg)
            STARTED=\$(sudo docker inspect -f '{{.State.StartedAt}}' eterapy-lb-haproxy-1 2>/dev/null || echo '')
            STARTED_AT=\$([ -n \"\$STARTED\" ] && date -d \"\$STARTED\" +%s || echo 0)
            if [ \"\$CFG_AT\" -gt \"\$STARTED_AT\" ]; then
              sudo docker compose -f docker-compose.lb.yml --profile lb restart haproxy
              echo 'LB: конфиг новее процесса — балансировщик перезапущен'
            else
              echo 'LB: процесс уже с этим конфигом — перезапуск не нужен'
            fi"
          # Reclaim space BEFORE loading: each release image is ~2.6GB and the
          # old `docker image prune -f` only removes dangling layers, so tagged
          # releases piled up until the disk filled and `docker load` failed.
          # Drop every eterapy-web image except the one the running container
          # uses (never touches the live container's image).
          # INC-095: the same must happen for `eterapy-web-staging`. eterapy-1
          # hosts both stacks plus Postgres on a 30GB disk, so two superseded
          # staging images (~4.5GB each) were enough to fill it — Postgres then
          # failed mid-migration and the workers crash-looped on ENOSPC, which
          # read as "the new migration broke". Each repository keeps only the
          # image its own running container uses, plus the one being shipped.
          $SSH "RUNNING=\$(sudo docker inspect --format '{{.Config.Image}}' eterapy-web-1 2>/dev/null || true); \
            sudo docker images eterapy-web --format '{{.Repository}}:{{.Tag}}' \
            | grep -v \"^\${RUNNING}\$\" | grep -v \"^eterapy-web:${GITHUB_SHA::8}\$\" \
            | xargs -r sudo docker rmi 2>/dev/null || true; \
            STAGING=\$(sudo docker inspect --format '{{.Config.Image}}' eterapy-staging-web-1 2>/dev/null || true); \
            sudo docker images eterapy-web-staging --format '{{.Repository}}:{{.Tag}}' \
            | grep -v \"^\${STAGING}\$\" \
            | xargs -r sudo docker rmi 2>/dev/null || true; \
            sudo docker image prune -f >/dev/null 2>&1 || true"
          DISK_FREE=$($SSH "df -BG --output=avail / | tail -1 | tr -dc '0-9'" || echo 99)
          echo "▶ свободно на ноде перед загрузкой образа: ${DISK_FREE}G"
          if [ "${DISK_FREE:-99}" -lt 6 ]; then
            echo "::error::На ноде осталось ${DISK_FREE}G — образа ~4.5GB не хватит места. Выкатка остановлена до освобождения диска."
            exit 1
          fi
          docker save "eterapy-web:${GITHUB_SHA::8}" | gzip -1 | $SSH 'gunzip | sudo docker load'
          # B541/B537: stamp the node's identity and role into its .env.
          # Values come from env (NODE_SLUG/NODE_STANDBY), never interpolated
          # into the shell. NB: grep must run under sudo — /opt/eterapy/.env is
          # root-only, so an unprivileged grep always failed and the append
          # branch ran on every deploy, piling up duplicate keys (seen on
          # eterapy-2, found while building B537).
          for kv in "FLEET_NODE_NAME=$NODE_SLUG" "FLEET_NODE_STANDBY=$NODE_STANDBY"; do
            key="${kv%%=*}"
            $SSH "sudo grep -q '^$key=' /opt/eterapy/.env \
              && sudo sed -i 's#^$key=.*#$kv#' /opt/eterapy/.env \
              || echo '$kv' | sudo tee -a /opt/eterapy/.env >/dev/null"
          done
          # B572: адрес, на котором нода слышна панели мониторинга. Раньше это
          # был node-local `.env` (вписан руками на eterapy-2 при B540) — то
          # есть значение, которого нет в git, и при пересборке ноды оно
          # исчезает вместе с мониторингом. Теперь едет из матрицы.
          # Пусто → ключ УДАЛЯЕМ: в compose стоит `${ETERAPY_WEB_BIND:-127.0.0.1}`,
          # и оставленный пустой ключ читался бы как «слушать все интерфейсы»,
          # а файрвола на хостах нет (PRB-009).
          if [ -n "$NODE_WEB_BIND" ]; then
            $SSH "sudo sed -i '/^ETERAPY_WEB_BIND=/d' /opt/eterapy/.env \
              && echo 'ETERAPY_WEB_BIND=$NODE_WEB_BIND' | sudo tee -a /opt/eterapy/.env >/dev/null"
            echo "▶ ETERAPY_WEB_BIND=$NODE_WEB_BIND"
          else
            $SSH "sudo sed -i '/^ETERAPY_WEB_BIND=/d' /opt/eterapy/.env"
            echo "▶ ETERAPY_WEB_BIND снят (нода вне моста флота)"
          fi
          # B423/B566: платёжные креды приезжают выкаткой из секретов репозитория.
          # Владелец не правит .env на хосте руками — значит значение, которого
          # нет в git-управляемом пути, до прода не доедет (так уже случилось со
          # стейджевым allowlist в B554). Секрет пуст → ключ не трогаем вовсе,
          # поэтому шаг безопасен, пока владелец не завёл секреты.
          # Значения идут через stdin, а не в строку команды: в паролях бывают
          # символы, которые shell и sed истолкуют по-своему.
          for key in ROBOKASSA_MERCHANT_LOGIN ROBOKASSA_PASSWORD_1 ROBOKASSA_PASSWORD_2 \
                     ROBOKASSA_TEST_PASSWORD_1 ROBOKASSA_TEST_PASSWORD_2 \
                     ROBOKASSA_HASH_ALGORITHM ROBOKASSA_IS_TEST \
                     PAYMENT_PROVIDER TELEGRAM_STARS_RUB_RATE \
                     CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN \
                     FLEET_GITHUB_TOKEN \
                     TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_CHANNEL_ID \
                     TELEGRAM_ETERAPY_CHAT_ID \
                     THREADS_APP_ID THREADS_APP_SECRET \
                     INSTAGRAM_APP_ID INSTAGRAM_APP_SECRET \
                     REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET REDDIT_USER_AGENT \
                     REDDIT_SUBREDDITS REDDIT_POST_SUBREDDIT \
                     YANDEX_OAUTH_TOKEN YANDEX_WORDSTAT_API_KEY YANDEX_CLOUD_FOLDER_ID; do
            eval "value=\${$key:-}"
            [ -n "$value" ] || continue
            printf '%s\n' "$value" | $SSH "sudo sed -i '/^$key=/d' /opt/eterapy/.env \
              && read -r v \
              && printf '$key=%s\n' \"\$v\" | sudo tee -a /opt/eterapy/.env >/dev/null"
            echo "▶ $key доставлен"
          done

          # B569: инвентарь для панели мониторинга флота. Источник истины —
          # deploy/fleet-matrix.json, тот же файл, из которого job `plan`
          # набирает ноды для выкатки; расходиться им теперь нечем. Берём файл
          # ЦЕЛИКОМ, а не выборку нод: панель показывает весь флот, даже когда
          # катят одну ноду. `name` — это slug, потому что кнопка редеплоя в
          # админке ходит по слагам.
          # baseUrl обязателен: порт 3200 слушает только 127.0.0.1, поэтому
          # умолчание `http://<ip>:3200` для чужих нод всегда даёт таймаут —
          # панель показывала весь флот «недоступен». Свой узел опрашивается по
          # loopback, остальные — через sslip.io за nginx (проверено вживую).
          FLEET_NODES=$(jq -c '[.[] | {name: .slug, host, role, contour, baseUrl}]' deploy/fleet-matrix.json)
          printf '%s\n' "$FLEET_NODES" | $SSH "sudo sed -i '/^FLEET_NODES=/d' /opt/eterapy/.env \
            && read -r v \
            && printf 'FLEET_NODES=%s\n' \"\$v\" | sudo tee -a /opt/eterapy/.env >/dev/null"
          echo "▶ FLEET_NODES доставлен ($(printf '%s' "$FLEET_NODES" | jq 'length') нод)"

          $SSH "sudo sed -i 's#^ETERAPY_IMAGE=.*#ETERAPY_IMAGE=eterapy-web:${GITHUB_SHA::8}#' /opt/eterapy/.env \
            && cd /opt/eterapy && { sudo docker compose -f $COMPOSE_FILE_NAME $PROFILE_ARGS up -d --remove-orphans || { echo 'compose up race — retry'; sleep 5; sudo docker compose -f $COMPOSE_FILE_NAME $PROFILE_ARGS up -d --remove-orphans; }; } \
            && sudo docker image prune -f >/dev/null \
            && sudo docker compose -f $COMPOSE_FILE_NAME ps"

          # INC-079: `up --remove-orphans` не убирает контейнер сервиса, чей
          # профиль выключен, — такой сервис объявлен в compose-файле и орфаном
          # не считается. На standby так остался worker, вышедший с кодом 1 (он
          # писал в read-only реплику), и панель флота из-за его тега неделю
          # показывала «разные версии». Чистим только ОСТАНОВЛЕННЫЕ контейнеры
          # этого проекта старше суток: контейнеры текущей выкатки (включая
          # отработавший migrate) моложе порога и остаются вместе с логами.
          # Аргументы статические — внешнего ввода в команде нет.
          $SSH "sudo docker container prune -f \
            --filter label=com.docker.compose.project=eterapy \
            --filter until=24h" || echo "prune пропущен (не критично)"
          echo "▶ следы прошлых выкаток убраны"

          # INC-095: чистка образов выполняется ДО загрузки нового (см. выше).
          # Здесь она бессмысленна: если места не хватило, converge уже упал.
          DISK_FREE_AFTER=$($SSH "df -BG --output=avail / | tail -1 | tr -dc '0-9'" || echo 99)
          echo "▶ свободно на ноде после выкатки: ${DISK_FREE_AFTER}G"
          echo "▶ worker health"
          sleep 5
          if [ "$NODE_STANDBY" = "1" ]; then
            # B537: на standby worker намеренно не поднимается — он пишет на
            # каждом тике, а локальная БД read-only. Требовать его «running»
            # здесь значит валить деплой за штатное поведение (и получить в
            # логах старые ошибки уже остановленного контейнера).
            echo "standby node: worker намеренно не запущен — проверка пропущена"
          else
            WORKER_STATUS=$($SSH "sudo docker inspect -f '{{.State.Status}}' eterapy-worker-1" || echo missing)
            echo "eterapy-worker container → $WORKER_STATUS"
            if [ "$WORKER_STATUS" != "running" ]; then
              $SSH "sudo docker logs eterapy-worker-1 --tail 100" || true
              exit 1
            fi
            # B610: outbound social publishing must have exactly one active
            # scheduler. It is declared only by the primary-node compose file;
            # edge workers keep processing their local queues but must never
            # duplicate posts or moderation messages.
            if [ "$NODE_ROLE" = "primary" ]; then
              MARKETING_STATUS=$($SSH "sudo docker inspect -f '{{.State.Status}}' eterapy-marketing-agent-1" || echo missing)
              echo "eterapy-marketing-agent container → $MARKETING_STATUS"
              if [ "$MARKETING_STATUS" != "running" ]; then
                $SSH "sudo docker logs eterapy-marketing-agent-1 --tail 100" || true
                exit 1
              fi
            else
              echo "$NODE_ROLE node: marketing agent intentionally absent — singleton runs on primary"
            fi
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # Matrix legs collapse into a single needs.deploy.result, which hides
      # WHICH host failed. Each leg records its own verdict for the notifier.
      - name: Record node result
        if: always()
        env:
          NODE_NAME: ${{ matrix.vm.name }}
          NODE_RESULT: ${{ job.status }}
        run: |
          mkdir -p node-status
          printf '%s=%s\n' "$NODE_NAME" "$NODE_RESULT" > "node-status/${{ matrix.vm.slug }}.txt"

      - name: Upload node result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-status-${{ matrix.vm.slug }}
          path: node-status/
          retention-days: 7

  verify:
    name: Health check
    needs: deploy
    # Runs even when a standby leg failed: a broken secondary must never hide
    # whether the live site is actually up. Only eterapy-1 gates this job.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe /api/health and subdomains
        run: |
          sleep 10
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
            [ "$STATUS" = "200" ] && { echo "✓ $HEALTH_URL → 200"; break; }
            [ "$i" = "30" ] && { echo "::error::health failed"; exit 1; }
            echo "… attempt $i: $STATUS"; sleep 6
          done
          for url in "$APP_URL" "$ADMIN_URL"; do
            S=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            case "$S" in
              2*|3*) echo "✓ $url → $S" ;;
              *) echo "::error::$url failed (status: $S)"; exit 1 ;;
            esac
          done

      - name: Probe fleet health
        if: always()
        run: |
          mkdir -p health-status
          probe() {
            slug="$1"; label="$2"; url="$3"
            S=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            if [ "$S" = "200" ]; then
              echo "✓ $label → 200"
              printf '%s=success\n' "$label" > "health-status/$slug.txt"
            else
              echo "::warning::$label health → $S"
              printf '%s=failure\n' "$label" > "health-status/$slug.txt"
            fi
          }
          probe eterapy-1 "eterapy-1 prod RU" "$HEALTH_URL"
          probe eterapy-2 "eterapy-2 standby RU" "https://192.144.13.153.sslip.io/api/health"
          probe eterapy-3 "eterapy-3 US racknerd" "https://107.172.153.202.sslip.io/api/health"
          probe eterapy-4 "eterapy-4 EU aws" "https://18.195.184.182.sslip.io/api/health"

      - name: Reject an unexpected public service port
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly hosts=(
            "192.144.14.146"
            "192.144.13.153"
            "107.172.153.202"
            "18.195.184.182"
          )
          readonly restricted_ports=("5432" "3200" "6379" "7880")
          failures=0
          for host in "${hosts[@]}"; do
            for port in "${restricted_ports[@]}"; do
              if timeout 3 bash -c "exec 3<>/dev/tcp/${host}/${port}" 2>/dev/null; then
                printf '::error::unexpected public listener %s:%s\n' "$host" "$port"
                failures=$((failures + 1))
              else
                printf '✓ %s:%s is not reachable publicly\n' "$host" "$port"
              fi
            done
          done
          if (( failures > 0 )); then
            printf 'Restricted public listeners found: %s\n' "$failures" >&2
            exit 1
          fi

      - name: Upload fleet health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-health
          path: health-status/
          retention-days: 7

  notify:
    name: Notify Telegram
    needs: [test, deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Collect per-node results
        uses: actions/download-artifact@v4
        with:
          pattern: deploy-status-*
          path: node-status
          merge-multiple: true
        continue-on-error: true

      - name: Collect fleet health
        uses: actions/download-artifact@v4
        with:
          name: fleet-health
          path: health-status
        continue-on-error: true

      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_DEPLOY_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: PRODUCTION deploy
          EMOJI: "🚀"
          STAGES: |
            tests=${{ needs.test.result }}
            deploy=${{ needs.deploy.result }}
            health=${{ needs.verify.result }}
          GH_ACTOR: ${{ github.actor }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER: ${{ github.server_url }}
          # Commit messages are attacker-influenceable and multi-line: kept in
          # env, flattened to one line, and HTML-escaped by the notifier.
          GH_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FIRST_LINE=$(printf '%s' "$GH_MSG" | head -n 1 | cut -c1-200)
          export FIELDS="Env=production (4-node fleet)
          Repo=$GH_REPO
          Branch=$GH_REF
          Commit=${GH_SHA:0:8}
          Image=eterapy-web:${GH_SHA:0:8}
          Author=$GH_ACTOR
          Message=$FIRST_LINE"

          # Deploy verdict per host, plus the health probe that followed it.
          NODES=""
          for slug in eterapy-1 eterapy-2 eterapy-3 eterapy-4; do
            [ -f "node-status/$slug.txt" ] || continue
            entry=$(cat "node-status/$slug.txt")
            label="${entry%%=*}"
            result="${entry#*=}"
            if [ -f "health-status/$slug.txt" ]; then
              health=$(cat "health-status/$slug.txt")
              health="${health#*=}"
              [ "$health" = "success" ] && label="$label · health 200" || label="$label · health DOWN"
              [ "$result" = "success" ] && [ "$health" != "success" ] && result="failure"
            fi
            NODES="$NODES$label=$result
          "
          done
          export NODES
          export EXTRA_LINKS="Commit=$GH_SERVER/$GH_REPO/commit/$GH_SHA"
          bash .github/scripts/telegram-notify.sh
        continue-on-error: true
