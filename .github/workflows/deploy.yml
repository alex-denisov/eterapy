name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  # ======== STAGE 1: TEST ========
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Generate Prisma Client
        working-directory: ./web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
        run: npx prisma generate

      - name: Run linter (disabled for now)
        if: false
        working-directory: ./web
        run: npm run lint

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        working-directory: ./web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
        run: npm test -- --passWithNoTests

  # ======== STAGE 2: BUILD ========
  build:
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: rm -f package-lock.json && npm install --force

      - name: Generate Prisma Client
        working-directory: ./web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
        run: npx prisma generate

      - name: Build application
        working-directory: ./web
        env:
          NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://app.eterapy.com' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run build

      - name: Debug - List .next directory
        run: |
          echo "=== Checking web/.next/ ==="
          ls -la web/.next/ || echo "web/.next/ not found"
          find web/.next/ -type f | head -20 || echo "No files found"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: web/.next/
          retention-days: 1

  # ======== STAGE 3: DEPLOY ========
  deploy:
    needs: [test, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: web/.next/

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.CLOUDU_ETERAPY_WEB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.144.14.146 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            -e 'ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='node_modules' --exclude='.git' \
            --exclude='public/uploads' \
            ./web/ admin@192.144.14.146:/home/admin/eterapy/web/

      - name: Restart application on VPS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes admin@192.144.14.146 '
            set -euxo pipefail
            cd /home/admin/eterapy/web
            # Source environment variables from .env and .env.local on VPS
            if [ -f .env ]; then export $(grep -v "^#" .env | xargs); fi
            if [ -f .env.local ]; then export $(grep -v "^#" .env.local | xargs); fi
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            pm2 startOrReload /home/admin/eterapy/deploy/ecosystem.config.js --update-env
            pm2 save
          '

      - name: Verify deployment
        id: verify
        run: |
          echo "Waiting for application to start..."
          sleep 10

          HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://eterapy.com/api/health || echo "000")
          APP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://app.eterapy.com || echo "000")
          ADMIN_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://admin.eterapy.com || echo "000")

          echo "Health endpoint: $HEALTH_STATUS"
          echo "App endpoint: $APP_STATUS"
          echo "Admin endpoint: $ADMIN_STATUS"

          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "❌ Health check failed (status: $HEALTH_STATUS)"
            exit 1
          fi

          if [ "$APP_STATUS" != "200" ] && [ "$APP_STATUS" != "307" ] && [ "$APP_STATUS" != "308" ]; then
            echo "❌ App check failed (status: $APP_STATUS)"
            exit 1
          fi

          if [ "$ADMIN_STATUS" != "200" ] && [ "$ADMIN_STATUS" != "307" ] && [ "$ADMIN_STATUS" != "308" ]; then
            echo "❌ Admin check failed (status: $ADMIN_STATUS)"
            exit 1
          fi

          echo "✅ All deployment checks passed!"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ======== STAGE 4: NOTIFICATION (consolidated) ========
  notify:
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram not configured. Skipping notification."
            exit 0
          fi

          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          MSG="${{ github.event.head_commit.message || '(no message)' }}"
          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          # Build status emoji line
          if [ "$TEST_RESULT" = "success" ]; then
            TEST_ICON="✅"
          elif [ "$TEST_RESULT" = "failure" ]; then
            TEST_ICON="❌"
          else
            TEST_ICON="⏭️"
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            BUILD_ICON="✅"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            BUILD_ICON="❌"
          else
            BUILD_ICON="⏭️"
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            DEPLOY_ICON="✅"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            DEPLOY_ICON="❌"
          else
            DEPLOY_ICON="⏭️"
          fi

          # Overall status
          if [ "$DEPLOY_RESULT" = "success" ]; then
            OVERALL="🚀 Pipeline SUCCESS"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            OVERALL="❌ Pipeline FAILED at BUILD"
          elif [ "$TEST_RESULT" = "failure" ]; then
            OVERALL="❌ Pipeline FAILED at TESTS"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            OVERALL="❌ Pipeline FAILED at DEPLOY"
          else
            OVERALL="⚠️ Pipeline status unclear"
          fi

          BODY="${OVERALL}%0A%0A${TEST_ICON} Tests | ${BUILD_ICON} Build | ${DEPLOY_ICON} Deploy%0A%0ACommit: ${SHA:0:7}%0ABranch: ${REF}%0AActor: ${ACTOR}%0A%0AMessage: ${MSG}"

          if [ "$TEST_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "failure" ]; then
            BODY="${BODY}%0A%0A📋 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          # Convert %0A to newlines for curl
          TEXT=$(echo "$BODY" | sed 's/%0A/\n/g')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification failed"
