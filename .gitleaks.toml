# gitleaks — сканер секретов в рабочем дереве и во всей истории git (1267 коммитов).
#
# ЗАЧЕМ КОНФИГ. На голых правилах скан даёт 19 срабатываний, и восемнадцать из
# них — не секреты: слаги контент-плана (`content-plan.ts`), имена ключей
# localStorage (`guest-result-cache.ts`), ключ учёта в `ip-accounting.ts` и
# синтетические ключи в `__tests__/`. Правило `generic-api-key` ловит любую
# конструкцию вида `key: "…"` с достаточной энтропией, а в TypeScript так
# выглядит половина словарей.
#
# Сканер, который всегда красный, перестают читать. Список ниже гасит ровно эти
# случаи, чтобы gitleaks можно было поставить в `npm run security:baseline`
# рядом с существующим `security-secret-scan.mjs`: тот проверяет рабочее дерево,
# gitleaks — всю историю, то есть ровно то, что нельзя починить одним коммитом.
#
# ОСТАЛОСЬ РАЗОБРАТЬ (не гасится намеренно): коммит fc472398 от 2026-05-01,
# `.github/workflows/deploy.yml:96` — запасное значение
# `${{ secrets.YOOKASSA_SECRET_KEY || '…' }}` длиной 29 символов. В текущем файле
# его уже нет, но в истории публичного репозитория оно осталось. По форме похоже
# на тестовый ключ; подтвердить и, если это боевой ключ ЮKassa, отозвать.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]
entropy = 3.5

  [rules.allowlist]
  paths = [
    '''.*__tests__/.*''',
    '''.*\.test\.tsx?$''',
    '''.*\.spec\.tsx?$''',
    '''.*/skills/.*''',                        # примеры кода в скиллах
    '''web/src/lib/marketing/content-plan\.ts$''',  # слаги рубрик, не ключи
    '''web/src/lib/guest-result-cache\.ts$''',      # имя ключа localStorage
    '''web/src/lib/ip-accounting\.ts$''',           # имя ключа учёта
  ]
