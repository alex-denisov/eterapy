# B657 / INC-099 — потолок системного журнала на нодах флота.
#
# По умолчанию journald отдаёт под журнал до 10 % раздела и чистит его только
# у нижней границы свободного места. На eterapy-1 (30 ГБ на всё: прод, стенд,
# Postgres, LiveKit) это выливалось в 944 МБ журнала при 5 ГБ свободных — а
# свободное место там расходуется на образы релизов, и именно его нехватка
# роняет выкатку по таймауту.
#
# 200 МБ хватает на несколько суток разбора инцидента и не соревнуется с
# образами за диск. Файл кладётся drop-in'ом, чтобы не переписывать штатный
# journald.conf дистрибутива.
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=1week
