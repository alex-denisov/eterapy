# B631 — публичный вход для вебхуков Meta.
#
# Зачем отдельное имя. Записи `eterapy.com`, `app.` и `admin.` в Cloudflare
# серые: DNS отдаёт российский адрес ноды напрямую. Проверка вебхука со стороны
# Meta до него не доходит — замер владельца 2026-07-30:
# `curl_errno = 28; Connection timed out after 6000 milliseconds`. Обратное
# направление такое же: с ноды не отвечают ни `graph.facebook.com`, ни
# `graph.instagram.com`, при этом `graph.threads.net` по ТОМУ ЖЕ адресу отвечает
# за 0.16 с — режется имя, а не сеть.
#
# `hooks.eterapy.com` — оранжевая запись: Meta приходит на край Cloudflare, а
# Cloudflare уже идёт к нам. Приложение и кабинет остаются на прежних именах и
# прежнем пути: липкость балансировщика и кеш публичных страниц (B-INC-080) не
# затрагиваются вовсе.
#
# Сертификат здесь — общий сертификат `eterapy.com`, и имя в нём не совпадает.
# Это проверено, а не предположено: Cloudflare уже соединился с этим origin по
# HTTPS и несовпадение принял, то есть режим зоны не «Full (strict)». Наружу
# посетитель видит сертификат Cloudflare, а не этот.
#
# Наружу открыты ТОЛЬКО маршруты вебхуков. Всё остальное на этом имени — 404:
# второй публичный вход в приложение нам не нужен, а любой лишний маршрут здесь
# обошёл бы контур, который для основных имён уже настроен.

server {
    listen 80;
    listen [::]:80;
    server_name hooks.eterapy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cloudflare в режиме Flexible ходит к origin по HTTP. Редирект здесь дал бы
    # цикл, поэтому обслуживаем те же маршруты, а не отправляем обратно.
    location = /api/integrations/meta/threads/webhook {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host eterapy.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host eterapy.com;
        proxy_read_timeout 60;
    }

    location = /api/integrations/meta/instagram/webhook {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host eterapy.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host eterapy.com;
        proxy_read_timeout 60;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hooks.eterapy.com;

    ssl_certificate /etc/letsencrypt/live/eterapy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eterapy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    # Приложение маршрутизирует по хосту (кабинет живёт на `app.`), поэтому
    # внутрь идёт основное имя: `hooks.` — это вход, а не отдельный контур.
    location = /api/integrations/meta/threads/webhook {
        proxy_pass http://127.0.0.1:3300; # B540 contour HAProxy
        proxy_http_version 1.1;
        proxy_set_header Host eterapy.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host eterapy.com;
        proxy_read_timeout 60;
    }

    location = /api/integrations/meta/instagram/webhook {
        proxy_pass http://127.0.0.1:3300; # B540 contour HAProxy
        proxy_http_version 1.1;
        proxy_set_header Host eterapy.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host eterapy.com;
        proxy_read_timeout 60;
    }

    location / {
        return 404;
    }
}
