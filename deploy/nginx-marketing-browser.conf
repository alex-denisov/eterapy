# B698 — окно браузерной сессии владельца на admin.eterapy.com.
#
# Вставляется в server-блок admin.eterapy.com. Три свойства, ради которых это
# здесь, а не в приложении:
#
#   1. WebSocket. Next.js его не проксирует; nginx умеет штатно.
#   2. Права. Проверяет их тот, кто их знает: `auth_request` спрашивает
#      приложение, и на всё, кроме 204, доступа нет. Сам сервис слушает
#      WireGuard и в интернет не выведен ни одним портом.
#   3. Долгие соединения. Окно висит открытым, пока владелец вводит код из СМС.

location = /internal/browser-authz {
    internal;
    proxy_pass              http://127.0.0.1:3300/api/admin/marketing/browser-authz;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI $request_uri;
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        Host $host;
}

location /ops/browser/ {
    auth_request /internal/browser-authz;

    # 10.77.0.2 — адрес eterapy-2 в WireGuard: узел, несущий профиль
    # marketing-browser (см. deploy/fleet-matrix.json).
    proxy_pass http://10.77.0.2:7900/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;

    # Окно живёт, пока владелец входит: капча и код из СМС занимают минуты.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
}
