# B473 — prod-VM variant: app runtime only. nginx, TLS certs and the system
# PostgreSQL stay exactly as they are (host network, DATABASE_URL=localhost);
# only the PM2 processes are replaced by containers.
#
#   sudo docker compose -f docker-compose.prod.yml up -d               # web (+migrate)
#   sudo docker compose -f docker-compose.prod.yml --profile worker up -d   # + worker (cutover only:
#                                                        stop the PM2 worker first — the DB queue
#                                                        must never have two consumers)
#
# Rollback: switch the nginx upstream back to the PM2 port and (if needed)
# `pm2 start eterapy-worker`.

name: eterapy

services:
  migrate:
    image: ${ETERAPY_IMAGE:?set in .env}
    network_mode: host
    restart: "no"
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]

  web:
    image: ${ETERAPY_IMAGE}
    network_mode: host
    restart: always
    env_file: .env
    environment:
      # Allows the authenticated "run now" endpoint to execute the same
      # narrowly allow-listed public-social writer/reviewer route.
      MARKETING_FOREIGN_LLM_ENABLED: "true"
      # B702: тот же гейт, что у marketing-agent. Проход из админки
      # («запустить сейчас») исполняет web-контейнер, и разойтись в поведении
      # они не должны: иначе ручной прогон строил бы план не тем механизмом,
      # что фоновый, и замер сравнивал бы разное.
      MARKETING_PLANNER_ENABLED: "true"
    # Bound to loopback — only the host nginx talks to it.
    command: ["npm", "start", "--", "--port", "${ETERAPY_APP_PORT:-3200}", "--hostname", "127.0.0.1"]
    volumes:
      - uploads:/app/web/public/uploads
      # B544: состояние хоста от collect-node-state.sh (docker-сокет НЕ пробрасываем)
      - ./state:/app/state:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${ETERAPY_APP_PORT:-3200}/api/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    image: ${ETERAPY_IMAGE}
    profiles: ["worker"]
    network_mode: host
    restart: always
    env_file: .env
    environment:
      MARKETING_NOTIFICATIONS: "true"
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  marketing-agent:
    image: ${ETERAPY_IMAGE}
    profiles: ["worker"]
    network_mode: host
    restart: always
    init: true
    shm_size: "1gb"
    env_file: .env
    environment:
      # No client/practitioner data enters the foreign LLM prompt. This narrow
      # flag does not re-enable foreign LLMs for the main application contour.
      MARKETING_FOREIGN_LLM_ENABLED: "true"
      # Production defaults on; staging's contour-specific .env keeps this
      # false unless a deliberate staging run is requested.
      MARKETING_AGENT_ENABLED: "${MARKETING_AGENT_ENABLED:-true}"
      # Owner-approved autonomous publishing of independently reviewed owned
      # posts. Comments on third-party materials still require TG moderation.
      MARKETING_AUTOPUBLISH: "true"
      TELEGRAM_CHANNEL_ID: "${TELEGRAM_CHANNEL_ID:--1004301988677}"
      # Reddit is executed by the installation-scoped Devvit companion. Until
      # its shared secret and installation exist, Reddit stays fail-closed.
      REDDIT_DEVVIT_ENABLED: "true"
      # B702: тему слота выбирает планировщик — спрос семантического ядра плюс
      # живые тренды, а не позиция в ротации константы TOPICS. Включается после
      # того, как оба живых источника трендов доказаны боевыми ключами на самом
      # проде 2026-08-11 (динамика Wordstat и поисковая выдача; первый прогон
      # дал ноль кандидатов и вскрыл три дефекта, которых мок не ловил).
      # Остов плана — площадка, день, время, формат, класс — остаётся
      # детерминированным: не-детерминирован только выбор темы.
      MARKETING_PLANNER_ENABLED: "true"
    command: ["npm", "run", "worker:marketing"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  uploads:
