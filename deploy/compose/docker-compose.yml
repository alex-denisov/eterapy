# B473 — full eterapy stack on one VM. Everything tunable lives in ./.env
# (see .env.example): image tag, domain, DB password, app secrets.
#
#   docker compose pull/load → docker compose up -d      # deploy / converge
#   ETERAPY_IMAGE=eterapy-web:<old sha> docker compose up -d   # instant rollback

name: eterapy

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${ETERAPY_DB_NAME:-eterapy}
      POSTGRES_USER: ${ETERAPY_DB_USER:-eterapy}
      POSTGRES_PASSWORD: ${ETERAPY_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ETERAPY_DB_USER:-eterapy} -d ${ETERAPY_DB_NAME:-eterapy}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${ETERAPY_IMAGE:?set in .env}
    restart: "no"
    env_file: .env
    # B537: на standby-узле локальная БД — read-only реплика eterapy-1, миграции
    # там выполнить нельзя. Выходим 0, иначе web не поднимется: он ждёт
    # service_completed_successfully. Схему на реплику приносит сама репликация.
    command:
      - sh
      - -c
      - |
        if [ "${FLEET_NODE_STANDBY:-0}" = "1" ]; then
          echo "standby node: skipping prisma migrate deploy (read-only replica)"
          exit 0
        fi
        exec npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${ETERAPY_IMAGE}
    restart: always
    env_file: .env
    # B540: узел контура должен быть достижим для HAProxy соседней ноды. По
    # умолчанию публикуем только на loopback (ничего не меняется, снаружи
    # закрыто); LB-пир получает адрес через ETERAPY_WEB_BIND — на RU-контуре
    # это WireGuard-адрес ноды (10.77.0.x), т.е. порт не выходит в интернет.
    ports:
      - "${ETERAPY_WEB_BIND:-127.0.0.1}:${ETERAPY_APP_PORT:-3200}:3000"
    volumes:
      - uploads:/app/web/public/uploads
      # B544: состояние хоста от collect-node-state.sh (docker-сокет НЕ пробрасываем)
      - ./state:/app/state:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    image: ${ETERAPY_IMAGE}
    restart: always
    env_file: .env
    command: ["npm", "run", "worker"]
    # B537: за профилем — worker пишет на каждом тике (job.create), на
    # read-only реплике это крэш-луп. Профиль дают только узлы с пишущей БД
    # (см. profile_args в deploy/fleet-matrix.json); на standby он стартует
    # шагом промоута, см. deploy/README-ru-replica.md.
    profiles: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # B698 — браузерная сессия владельца для площадок без API публикации (Дзен).
  #
  # За профилем: образ с Chromium нужен ровно одной ноде, а на eterapy-1 диск —
  # хронический дефицит (INC-095). Профиль включается в `profile_args` того
  # узла, который его несёт (сейчас eterapy-2: RU-адрес, 16 ГБ свободных и
  # запас памяти против 1.6 ГБ на primary).
  #
  # Порты по умолчанию — только loopback. Управляющий порт открывается пиру по
  # WireGuard через MARKETING_BROWSER_BIND (10.77.0.x), в интернет не выходит
  # ни один: окно входа владельца проксирует админка, проверив роль.
  marketing-browser:
    image: ${ETERAPY_BROWSER_IMAGE:-ghcr.io/alex-denisov/eterapy-browser:latest}
    restart: always
    profiles: ["marketing-browser"]
    environment:
      # Пусто → сервис выходит с понятной записью в журнале. `:?` здесь
      # был бы миной: он валит ВСЮ выкатку ноды, а не один сервис.
      BROWSER_CONTROL_TOKEN: ${MARKETING_BROWSER_TOKEN:-}
      BROWSER_CONTROL_PORT: "7801"
      BROWSER_VNC_PORT: "7900"
      BROWSER_PROFILE_DIR: /profile
    ports:
      - "${MARKETING_BROWSER_BIND:-127.0.0.1}:7801:7801"
      - "${MARKETING_BROWSER_BIND:-127.0.0.1}:7900:7900"
    volumes:
      # Профиль ПЕРЕЖИВАЕТ выкатку: он и есть сессия владельца. Потерять том —
      # значит заставить человека проходить вход с капчей заново.
      - browser_profile:/profile
    shm_size: "512mb"
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7801/health',{headers:{'x-eterapy-browser-token':process.env.BROWSER_CONTROL_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" (bare-IP HTTP) or "eterapy.com, app.eterapy.com, admin.eterapy.com"
      # (Caddy then provisions Let's Encrypt certificates automatically).
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Daily logical backup → ./backups (RPO). Ship the directory off-host (cron
  # rsync / object storage) for a real disaster story.
  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      PGHOST: db
      PGUSER: ${ETERAPY_DB_USER:-eterapy}
      PGPASSWORD: ${ETERAPY_DB_PASSWORD}
      PGDATABASE: ${ETERAPY_DB_NAME:-eterapy}
      BACKUP_KEEP: ${ETERAPY_BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f "/backups/eterapy-$$(date +%Y%m%d-%H%M%S).dump" \
            && ls -1t /backups/eterapy-*.dump | tail -n +$$((BACKUP_KEEP+1)) | xargs -r rm -f \
            && echo "backup ok $$(date)"
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  # B698: профиль браузера владельца. Не пересоздаётся выкаткой.
  browser_profile:
