# B540 — контурный балансировщик (HAProxy). Один инстанс на гео-контур:
#   eterapy-1 (cloud.ru) — RU-контур   → app-ноды eterapy-1 + eterapy-2
#   eterapy-4 (AWS)      — Foreign     → app-ноды eterapy-4 + eterapy-3
#
# TLS здесь НЕ терминируется: на LB-ноде уже стоит фронт (nginx на eterapy-1 c
# Let's Encrypt и всеми vhost'ами включая staging; Caddy на eterapy-4). HAProxy
# слушает только loopback:3300, фронт проксирует в него вместо прямого
# app-порта. Это делает отказ app-ноды прозрачным, не трогая сертификаты,
# staging-vhost'ы и CF-настройки.
#
# Адреса бэкендов приходят из .env ноды (LB_NODE_A / LB_NODE_B), см.
# deploy/lb/README.md. Меж-нодовый адрес — WireGuard (10.77.0.x), наружу
# app-порт не публикуется.

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Если залипшая cookie-нода мертва — уходим на живую вместо 503.
    option redispatch
    retries 3
    timeout connect 3s
    timeout client 65s
    timeout server 65s
    timeout tunnel 1h          # WebSocket / SSE (чат, уведомления, LiveKit-сигналинг)

frontend http_in
    bind 127.0.0.1:${LB_BIND_PORT}
    # Фронт уже проставил X-Forwarded-*; ничего не переписываем, чтобы
    # приложение видело реальный IP клиента и cf-ipcountry.

    # INC-080 — публичный трафик уходит на пул БЕЗ cookie привязки.
    # `cookie … nocache` (см. app_nodes) заставляет HAProxy приклеивать к
    # ответу `Cache-Control: private` — это штатная защита: раз в ответ
    # вставлена привязка к конкретной ноде, общий кеш такой ответ хранить не
    # должен. Но на маркетинговых страницах привязка не нужна вовсе: ноды
    # идентичны, база общая, страница одинакова с любой из них, — а `private`
    # запрещает CDN хранить заранее собранный HTML, ради которого и чинился
    # INC-080 в приложении.
    #
    # Что считается «аутентифицированным контуром» и остаётся липким:
    #   * поддомены app./admin.;
    #   * /api (rate-limit считается на ноде), /cabinet, /admin, /login,
    #     /register, /rtc — на основном домене кабинет живёт по пути, потому
    #     что NEXT_PUBLIC_PRIMARY_DOMAIN_ONLY по умолчанию включён;
    #   * всё, что не GET/HEAD, — формы и мутации.
    # Всё остальное — публичное и кешируемое.
    acl lb_host_app    hdr_beg(host) -i app.
    acl lb_host_admin  hdr_beg(host) -i admin.
    acl lb_path_private path_beg /api /cabinet /admin /login /register /rtc
    acl lb_cacheable_method method GET HEAD
    use_backend app_nodes_public if lb_cacheable_method !lb_host_app !lb_host_admin !lb_path_private

    default_backend app_nodes

backend app_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200
    # fall 2 — нода выпадает за ~6 с; rise 2 — возвращается только устойчиво живой.
    default-server check inter 3s fall 2 rise 2
    # Cookie-sticky = бесплатный эквивалент CF LB Session Affinity. Сессии
    # NextAuth stateless (один AUTH_SECRET на контур), поэтому affinity нужна
    # только для локальности LiveKit-комнат и rate-limit, а не для логина.
    cookie SRVID insert indirect nocache httponly secure
    server node-a ${LB_NODE_A} cookie a
    server node-b ${LB_NODE_B} cookie b

# INC-080 — тот же пул нод, но без cookie: ответ остаётся кешируемым.
# Здоровье не проверяем повторно, а ТРЕКАЕМ у app_nodes: иначе каждая нода
# получала бы вдвое больше health-check'ов, а два независимых счётчика могли
# бы разойтись во мнении, жива ли нода. `track` = одно решение на оба пула.
backend app_nodes_public
    balance roundrobin
    server node-a ${LB_NODE_A} track app_nodes/node-a
    server node-b ${LB_NODE_B} track app_nodes/node-b

# B542 — LiveKit-сигналинг контура (WS/HTTP :7880 нод кластера). Только
# сигналинг: медиа (RTC 7881/tcp + UDP) идёт НАПРЯМУЮ к ноде-хозяину комнаты,
# LB его не видит. Sticky не нужна — Redis-mesh сам маршрутизирует комнату
# на нужную ноду. Фронт (nginx /rtc) проксирует сюда вместо прямого :7880.
frontend livekit_ws
    bind 127.0.0.1:${LB_LIVEKIT_PORT}
    default_backend livekit_nodes

backend livekit_nodes
    balance roundrobin
    option httpchk
    # Корень LiveKit отвечает 200 OK — годится как liveness сигналинга.
    http-check send meth GET uri /
    http-check expect status 200
    default-server check inter 3s fall 2 rise 2
    server node-a ${LB_LIVEKIT_NODE_A}
    server node-b ${LB_LIVEKIT_NODE_B}

# Состояние бэкендов для мониторинга (B541) — только loopback.
listen stats
    bind 127.0.0.1:${LB_STATS_PORT}
    stats enable
    stats uri /
    stats refresh 5s
