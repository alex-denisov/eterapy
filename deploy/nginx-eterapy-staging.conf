# eterapy STAGING nginx site — /etc/nginx/sites-available/eterapy-staging
#
# Runs alongside the prod `eterapy` site on the same nginx. Isolated by:
#   - distinct server_name (staging.*)
#   - upstream port 3100 (prod is 3000)
#   - its own Let's Encrypt cert (staging.eterapy.com SAN bundle)
#
# Hardening vs prod:
#   - `X-Robots-Tag: noindex` on every response (never let staging into search)
#   - HTTP Basic Auth gate (/etc/nginx/.htpasswd-staging)
#
# Deploy is two-phase because the HTTPS blocks reference cert files that do
# not exist until certbot runs:
#   1. install with only the HTTP block, reload nginx
#   2. certbot certonly --webroot -w /var/www/certbot -d staging.eterapy.com \
#        -d staging.app.eterapy.com -d staging.admin.eterapy.com
#   3. uncomment the HTTPS blocks, reload nginx

# ─── HTTP → HTTPS redirect (and serve ACME challenge) ───
server {
    listen 80;
    listen [::]:80;
    server_name staging.eterapy.com staging.app.eterapy.com staging.admin.eterapy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── staging main — landing, public pages, auth ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.eterapy.com;

    ssl_certificate /etc/letsencrypt/live/staging.eterapy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.eterapy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # Never index staging
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gate the whole environment behind Basic Auth
    auth_basic "eterapy staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # Health endpoint must stay open for CI verify + uptime monitoring.
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Telegram webhook is called by the CF Worker relay (no Basic Auth header);
    # it is protected by the TELEGRAM_WEBHOOK_SECRET header the app validates.
    location = /api/telegram/webhook {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}

