services:
  postgres:
    image: postgres:16-alpine
    container_name: eterapy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eterapy
      POSTGRES_USER: eterapy
      POSTGRES_PASSWORD: eterapy_dev_pass
      # Оптимизация для dev (MacBook) и prod (VPS 2GB)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eterapy -d eterapy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
