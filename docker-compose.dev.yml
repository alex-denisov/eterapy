services:
  postgres:
    image: postgres:16-alpine
    container_name: eterapy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eterapy
      POSTGRES_USER: eterapy
      POSTGRES_PASSWORD: eterapy_dev_pass
      # Оптимизация для dev (MacBook) и prod (VPS 2GB)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eterapy -d eterapy"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: eterapy-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"   # HTTP/WebSocket
      - "7881:7881"   # RTC (TCP)
      - "7882:7882/udp" # RTC (UDP)
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # LiveKit Egress — запись видеосессий
  # Требует: livekit-egress образ и Redis для координации
  # Раскомментировать при наличии достаточных ресурсов
  # egress:
  #   image: livekit/egress:latest
  #   container_name: eterapy-egress
  #   restart: unless-stopped
  #   environment:
  #     EGRESS_CONFIG_BODY: |
  #       api_key: devkey
  #       api_secret: devsecret
  #       ws_url: ws://livekit:7880
  #       redis:
  #         address: redis:6379
  #       file_output:
  #         local: true
  #         local_directory: /recordings
  #   volumes:
  #     - ./web/public/uploads/recordings:/recordings
  #   depends_on:
  #     - livekit

volumes:
  postgres_data:
