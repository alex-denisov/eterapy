<!-- B627 — обложка страницы Facebook, 1640×624.
     Пропорции у Facebook и VK разные (1640×624 против 1590×400), поэтому
     растянуть готовую обложку VK нельзя: знак и подпись уехали бы за кроп.
     Содержимое держится внутри безопасной зоны 1200×450 по центру — именно её
     Facebook показывает на всех устройствах, остальное срезается по-разному
     на десктопе и в мобильном приложении. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
  <defs>
    <linearGradient id="halo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4C9A8"/>
      <stop offset="50%" stop-color="#E8B8D1"/>
      <stop offset="100%" stop-color="#D9C9E8"/>
    </linearGradient>
    <radialGradient id="hi" cx="35%" cy="33%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#FFF6E8"/>
      <stop offset="100%" stop-color="#FBF3E7"/>
    </radialGradient>
  </defs>
  <rect width="1640" height="624" fill="url(#lamp)"/>
  <!-- Безопасная зона: x 220..1420, y 87..537. -->
  <circle cx="450" cy="312" r="96" fill="url(#halo)"/>
  <circle cx="450" cy="312" r="96" fill="url(#hi)"/>
  <text x="606" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#5C2A2C">ETerapy</text>
  <text x="610" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#7A6A63" letter-spacing="0.4">Разбор ситуации, когда всё запуталось</text>
  <text x="610" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#B85B40">eterapy.com · первый разбор бесплатно</text>
</svg>
