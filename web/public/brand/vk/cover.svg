      <stop offset="0%" stop-color="#F4C9A8"/>
      <stop offset="50%" stop-color="#E8B8D1"/>
      <stop offset="100%" stop-color="#D9C9E8"/>
    </linearGradient>
    <radialGradient id="hi" cx="35%" cy="33%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#FFF6E8"/>
      <stop offset="100%" stop-color="#FBF3E7"/>
    </radialGradient>
  </defs>
  <rect width="1590" height="400" fill="url(#lamp)"/>
